<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const sent = st.sent === true;
    const onTv = st.onTv !== false;
    const caption = st.caption === undefined ? 'Le pont! Plus que 6 km' : st.caption;
    return {
      caption: caption,
      setCaption: (e) => this.setState({ caption: e.target.value.slice(0, 60) }),
      onTv: onTv,
      toggleTv: () => this.setState({ onTv: !onTv }),
      sendLabel: onTv ? 'Envoyer à l’écran géant' : 'Ajouter à mes photos',
      sent: sent,
      notSent: !sent,
      send: () => this.setState({ sent: true }),
      sentText: onTv
        ? 'Ton selfie passe à l’écran dans 3 min environ (4e dans la file). Il est aussi ajouté à tes photos.'
        : 'Ton selfie est ajouté à tes photos.'
    };
  }
}
</script>
