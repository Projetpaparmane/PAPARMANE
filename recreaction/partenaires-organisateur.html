<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Partenaires et commandites · Récréaction</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14201B}a:hover{color:#000000}
</style>
<link rel="stylesheet" href="prototype.css">
<script src="runtime.js" defer></script>
</head>
<body>
<a class="proto-home" href="index.html">Tous les écrans</a>
<div id="dc-root"></div>
<template id="dc-template">
<div style="min-height: 100vh; box-sizing: border-box; background: #EEF0EA; color: #14201B; font-family: 'Barlow', sans-serif">
<div style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 20px">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">
<div style="display: flex; align-items: center; gap: 8px">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: #FF5B1A; color: #14201B; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700">R</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700">Récréaction</span>
<span style="margin-left: 6px; padding-left: 12px; border-left: 1px solid #C5CBC2; font-size: 14px; font-weight: 600; color: #4A5650">Espace organisateur</span>
</div>
<div style="flex: 1 1 280px; min-width: 0">
<h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.2">Partenaires et commandites</h1>
<div style="font-size: 14px; color: #4A5650">Trail des Crêtes 2026 · samedi 17 octobre</div>
</div>
<button type="button" style="height: 44px; padding: 0 16px; border: 2px solid #FF5B1A; border-radius: 12px; background: #FF5B1A; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">+ Ajouter un partenaire</button>
</header>

<nav aria-label="Sections de l’espace organisateur" style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="organisateur.html" style="height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 999px; border: 2px solid #D9DDD5; background: #FFFFFF; color: #14201B; display: inline-flex; align-items: center; font-size: 15px; font-weight: 700; text-decoration: none">Poste de commandement</a>
<a href="benevoles.html" style="height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 999px; border: 2px solid #D9DDD5; background: #FFFFFF; color: #14201B; display: inline-flex; align-items: center; font-size: 15px; font-weight: 700; text-decoration: none">Bénévoles</a>
<a href="partenaires-organisateur.html" aria-current="page" style="height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 999px; border: 2px solid #14201B; background: #14201B; color: #FFFFFF; display: inline-flex; align-items: center; font-size: 15px; font-weight: 700; text-decoration: none">Partenaires</a>
<a href="infolettres.html" style="height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 999px; border: 2px solid #D9DDD5; background: #FFFFFF; color: #14201B; display: inline-flex; align-items: center; font-size: 15px; font-weight: 700; text-decoration: none">Infolettres</a>
</nav>

<section aria-label="Indicateurs des partenariats" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px">
<div style="background: #FFFFFF; border: 2px solid #FF5B1A; border-radius: 16px; padding: 12px 14px">
<div style="font-size: 13px; font-weight: 700; color: #A33A00">Commandites signées</div>
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1.05">17 500 $</div>
<div style="font-size: 12px; color: #4A5650">+ 1 000 $ en attente de signature</div>
</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px">
<div style="font-size: 13px; font-weight: 600; color: #4A5650">Partenaires</div>
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1.05">8</div>
<div style="font-size: 12px; color: #4A5650">1 présentateur · 2 or · 3 argent · 2 collaborateurs</div>
</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px">
<div style="font-size: 13px; font-weight: 600; color: #4A5650">Vues des logos</div>
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1.05">24 310</div>
<div style="font-size: 12px; color: #4A5650">app, dossards, photos et écran géant</div>
</div>
<div style="background: #FFFFFF; border-radius: 16px; padding: 14px 16px">
<div style="font-size: 13px; font-weight: 600; color: #4A5650">Coupons utilisés</div>
<div style="font-family: 'Barlow Condensed', sans-serif; font-size: 40px; font-weight: 700; line-height: 1.05">287</div>
<div style="font-size: 12px; color: #4A5650">dans le sac du coureur</div>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">

<section aria-label="Partenaires de l’événement" style="flex: 999 1 640px; min-width: 0; background: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 4px 12px; margin-bottom: 8px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Partenaires de l’événement</h2>
<span style="font-size: 13px; color: #4A5650">Montant · emplacements · visibilité</span>
</div>
<sc-for list="{{partners}}" as="p" hint-placeholder-count="8">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 0; border-top: 1px solid #E4E8E0">
<div style="flex: 1 1 230px; min-width: 0; display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 10px; background: {{p.logoBg}}; color: {{p.logoFg}}; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700">{{p.initials}}</span>
<span style="min-width: 0; display: flex; flex-direction: column; line-height: 1.25">
<strong style="font-size: 15px">{{p.name}}</strong>
<span style="font-size: 12px; font-weight: 700; color: {{p.tierColor}}">{{p.tier}}</span>
</span>
</div>
<span style="flex: 0 0 96px; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700">{{p.amount}}</span>
<span style="flex: 1 1 220px; min-width: 0; font-size: 13px; color: #4A5650">{{p.placements}}</span>
<span style="flex: 0 0 120px; font-size: 13px; text-align: right">{{p.views}}</span>
<span style="flex: 0 0 100px; box-sizing: border-box; text-align: center; border-radius: 6px; padding: 3px 8px; font-size: 12px; font-weight: 700; background: {{p.chipBg}}">{{p.status}}</span>
</div>
</sc-for>
<p style="margin: 10px 0 0; padding-top: 12px; border-top: 1px solid #E4E8E0; font-size: 14px; line-height: 1.45; color: #4A5650">Chaque partenaire a son propre accès dans l’app : il modifie son offre (vous l’approuvez avant la mise en ligne) et valide les coupons à son comptoir. <a href="espace-partenaire.html" style="font-weight: 700">Voir l’espace partenaire</a></p>
</section>

<aside style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

<section aria-label="Emplacements à vendre" style="background: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px">
<h2 style="margin: 0 0 6px; font-size: 17px; font-weight: 700">Emplacements</h2>
<sc-for list="{{spots}}" as="s" hint-placeholder-count="8">
<div style="display: flex; align-items: center; gap: 10px; padding: 7px 0; border-top: 1px solid #E4E8E0; font-size: 14px">
<span style="flex-grow: 1; min-width: 0"><strong>{{s.name}}</strong><br><span style="font-size: 12px; color: #4A5650">{{s.tier}}</span></span>
<span style="flex: none; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-weight: 700; background: {{s.chipBg}}; color: {{s.chipFg}}">{{s.status}}</span>
</div>
</sc-for>
</section>

<section aria-label="Partenaire officiel de la plateforme" style="background: #14201B; color: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 10px; background: #1F5F6B; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 16px; font-weight: 700">MS</span>
<span style="display: flex; flex-direction: column; line-height: 1.25"><span style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: #FF5B1A">PARTENAIRE OFFICIEL DE RÉCRÉACTION</span><strong style="font-size: 16px">Mutuelle Sentiers · assurances</strong></span>
</div>
<p style="margin: 0; font-size: 13px; line-height: 1.45; color: #C9D2CC">Visible à l’écran de démarrage de l’app et au bas de la page des partenaires, sur tous les événements. Jamais sur vos emplacements ni dans les messages de sécurité.</p>
<p style="margin: 0; font-size: 13px; line-height: 1.45; color: #C9D2CC">Catégorie exclusive : aucun de vos partenaires n’est un assureur. Si vous en signez un, il a priorité sur votre événement.</p>
</section>

<section aria-label="Rapport de visibilité" style="background: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">Rapport de visibilité</h2>
<p style="margin: 0; font-size: 14px; line-height: 1.4; color: #4A5650">Un rapport par partenaire après l’événement : vues de son logo, clics, coupons utilisés et photos partagées avec son cadre. C’est votre meilleur argument pour renouveler.</p>
<sc-if value="{{notReady}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{prepare}}" style="height: 44px; border: 0; border-radius: 10px; background: #14201B; color: #FFFFFF; font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Préparer les rapports</button>
</sc-if>
<sc-if value="{{ready}}" hint-placeholder-val="{{false}}">
<div role="status" style="background: #E3F1E8; border-radius: 10px; padding: 10px 12px; font-size: 14px; font-weight: 600">6 rapports prêts. Ils partiront aux partenaires le lendemain de l’événement.</div>
</sc-if>
</section>

</aside>
</div>

</div>
</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const ready = st.ready === true;
    const tiers = {
      pres: { label: 'Présentateur', color: '#A33A00' },
      or: { label: 'Partenaire or', color: '#14201B' },
      argent: { label: 'Partenaire argent', color: '#4A5650' },
      collab: { label: 'Collaborateur', color: '#4A5650' }
    };
    const partners = [
      { initials: 'BF', name: 'Boutique Foulée', tier: 'pres', amount: '8 000 $', placements: 'Nom de l’événement, dossard, cadre des photos, page d’inscription', views: '9 840 vues', status: 'Signé', logoBg: '#FF5B1A', logoFg: '#14201B' },
      { initials: 'E+', name: 'Électro+', tier: 'or', amount: '3 500 $', placements: 'Plan de course, écran géant, courriel J+1', views: '6 120 vues', status: 'Signé', logoBg: '#E4E8E0', logoFg: '#14201B' },
      { initials: 'PS', name: 'Physio Sommet', tier: 'or', amount: '3 000 $', placements: 'Sac du coureur, écran géant', views: '64 réservations', status: 'Signé', logoBg: '#2E5E8C', logoFg: '#FFFFFF' },
      { initials: 'VC', name: 'Ville de Val-des-Crêtes', tier: 'argent', amount: '2 000 $', placements: 'Page d’événement, carte du parcours', views: '3 480 vues', status: 'Signé', logoBg: '#14201B', logoFg: '#FFFFFF' },
      { initials: 'CV', name: 'Café du Village', tier: 'argent', amount: '1 000 $', placements: 'Carte-rabais en ville, carte du parcours', views: '112 coupons', status: 'Signé', logoBg: '#7A4A2A', logoFg: '#FFFFFF' },
      { initials: 'AL', name: 'Auberge du Lac', tier: 'argent', amount: '1 000 $', placements: 'Carte-rabais en ville', views: '—', status: 'À signer', logoBg: '#4F6B5A', logoFg: '#FFFFFF' },
      { initials: 'CC', name: 'Club de course Les Crêtes', tier: 'collab', amount: 'Échange', placements: 'Page des partenaires', views: '—', status: 'Signé', logoBg: '#E4E8E0', logoFg: '#14201B' },
      { initials: 'CS', name: 'Croix-Verte secours', tier: 'collab', amount: 'Échange', placements: 'Page des partenaires, poste de secours', views: '—', status: 'Signé', logoBg: '#2E7D4F', logoFg: '#FFFFFF' }
    ].map((p) => ({
      initials: p.initials,
      name: p.name,
      tier: tiers[p.tier].label,
      tierColor: tiers[p.tier].color,
      amount: p.amount,
      placements: p.placements,
      views: p.views,
      status: p.status,
      chipBg: p.status === 'Signé' ? '#E3F1E8' : '#FFE6D2',
      logoBg: p.logoBg,
      logoFg: p.logoFg
    }));
    const sold = { status: 'Vendu', chipBg: '#E4E8E0', chipFg: '#14201B' };
    const open = (label) => ({ status: label, chipBg: '#FF5B1A', chipFg: '#14201B' });
    const spots = [
      { name: 'Nom de l’événement « présenté par »', tier: 'Présentateur', ...sold },
      { name: 'Bande du dossard numérique', tier: 'Présentateur', ...sold },
      { name: 'Cadre des photos et de la vidéo d’arrivée', tier: 'Présentateur', ...sold },
      { name: 'Écran géant à l’arrivée', tier: 'Or · 3 places', ...open('1 place libre') },
      { name: 'Courriel J+1', tier: 'Or', ...sold },
      { name: 'Plan de course « présenté par »', tier: 'Or', ...sold },
      { name: 'Carte du parcours (kiosques)', tier: 'Argent · 4 places', ...open('2 places libres') },
      { name: 'Sac du coureur (offres)', tier: 'Tous les niveaux', ...open('Ouvert') }
    ];
    return {
      partners: partners,
      spots: spots,
      ready: ready,
      notReady: !ready,
      prepare: () => this.setState({ ready: true })
    };
  }
}
</script>
</body>
</html>
