<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Plan du site et parcours de l’organisateur · Récréaction</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14201B}a:hover{color:#000000}
</style>
<link rel="stylesheet" href="prototype.css">
<script src="runtime.js" defer></script>
</head>
<body>
<a class="proto-home" href="index.html">Tous les écrans</a>
<div id="dc-root"></div>
<template id="dc-template">
<div style="min-height: 100vh; box-sizing: border-box; background: #EEF0EA; color: #14201B; font-family: 'Barlow', sans-serif">
<div style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 24px 32px 40px; display: flex; flex-direction: column; gap: 20px">

<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px">
<div style="display: flex; align-items: center; gap: 8px">
<span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 8px; background: #FF5B1A; color: #14201B; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 20px; font-weight: 700">R</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 28px; font-weight: 700">Récréaction</span>
<span style="margin-left: 6px; padding-left: 12px; border-left: 1px solid #C5CBC2; font-size: 14px; font-weight: 600; color: #4A5650">Espace organisateur</span>
</div>
<div style="flex: 1 1 280px; min-width: 0">
<h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.2">Plan du site et parcours</h1>
<div style="font-size: 14px; color: #4A5650">Course Des-Chênes-Toi! Bourret 2027 · dimanche 23 mai</div>
</div>
<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<span style="font-size: 13px; color: #4A5650">{{publishNote}}</span>
<button type="button" onClick="{{publish}}" style="height: 44px; padding: 0 16px; border: 2px solid #FF5B1A; border-radius: 12px; background: #FF5B1A; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">Publier dans l’app</button>
</div>
</header>

<nav aria-label="Sections de l’espace organisateur" style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="organisateur.html" style="height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 999px; border: 2px solid #D9DDD5; background: #FFFFFF; color: #14201B; display: inline-flex; align-items: center; font-size: 15px; font-weight: 700; text-decoration: none">Poste de commandement</a>
<a href="benevoles.html" style="height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 999px; border: 2px solid #D9DDD5; background: #FFFFFF; color: #14201B; display: inline-flex; align-items: center; font-size: 15px; font-weight: 700; text-decoration: none">Bénévoles</a>
<a href="partenaires-organisateur.html" style="height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 999px; border: 2px solid #D9DDD5; background: #FFFFFF; color: #14201B; display: inline-flex; align-items: center; font-size: 15px; font-weight: 700; text-decoration: none">Partenaires</a>
<a href="infolettres.html" style="height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 999px; border: 2px solid #D9DDD5; background: #FFFFFF; color: #14201B; display: inline-flex; align-items: center; font-size: 15px; font-weight: 700; text-decoration: none">Infolettres</a>
<a href="plan-et-parcours-organisateur.html" aria-current="page" style="height: 44px; box-sizing: border-box; padding: 0 18px; border-radius: 999px; border: 2px solid #14201B; background: #14201B; color: #FFFFFF; display: inline-flex; align-items: center; font-size: 15px; font-weight: 700; text-decoration: none">Plan et parcours</a>
</nav>

<div role="group" aria-label="Affichage" style="display: inline-flex; align-self: flex-start; gap: 4px; padding: 4px; background: #DDE1D8; border-radius: 14px">
<button type="button" onClick="{{showPlan}}" aria-pressed="{{planPressed}}" style="height: 40px; padding: 0 18px; border: 0; border-radius: 10px; background: {{planTabBg}}; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">Plan du site</button>
<button type="button" onClick="{{showRoute}}" aria-pressed="{{routePressed}}" style="height: 40px; padding: 0 18px; border: 0; border-radius: 10px; background: {{routeTabBg}}; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">Parcours</button>
</div>

<sc-if value="{{isPlan}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">

<section aria-label="Plan du site" style="flex: 999 1 640px; min-width: 0; background: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px">
<div style="display: flex; align-items: center; gap: 10px; flex: 1 1 320px; min-width: 0">
<span aria-hidden="true" style="width: 40px; height: 40px; flex: none; border-radius: 10px; background: #FFE6D2; color: #A33A00; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">PDF</span>
<div style="min-width: 0">
<div style="font-size: 15px; font-weight: 700">plan-du-site-2027-4x8.pdf</div>
<div style="font-size: 13px; color: #4A5650">Ton plan illustré, importé tel quel · {{pinCount}} repères placés</div>
</div>
</div>
<button type="button" style="height: 44px; padding: 0 14px; border: 2px solid #14201B; border-radius: 12px; background: #FFFFFF; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Remplacer le plan</button>
</div>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px">
<span style="font-size: 14px; font-weight: 700; margin-right: 4px">Ajouter un repère :</span>
<sc-for list="{{palette}}" as="t" hint-placeholder-count="6">
<button type="button" onClick="{{t.add}}" style="height: 40px; padding: 0 12px 0 8px; border: 2px solid #D9DDD5; border-radius: 999px; background: #FFFFFF; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px"><span style="width: 22px; height: 22px; border-radius: 999px; background: {{t.bg}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">+</span>{{t.label}}</button>
</sc-for>
</div>

<div style="position: relative; width: 100%; aspect-ratio: 2 / 1; border-radius: 12px; overflow: hidden; background: #2B302C">
<img src="plan-des-chenes-toi.jpg" alt="Plan illustré du site de l’École Marie-Rivier, avec les repères placés par l’organisateur" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block">
<sc-for list="{{pins}}" as="p" hint-placeholder-count="10">
<button type="button" onClick="{{p.pick}}" aria-label="{{p.aria}}" aria-pressed="{{p.pressed}}" style="position: absolute; left: {{p.lx}}%; top: {{p.ty}}%; width: {{p.size}}px; height: {{p.size}}px; margin-left: {{p.offset}}px; margin-top: {{p.offset}}px; box-sizing: border-box; padding: 0; border-radius: 999px; border: 2px {{p.borderStyle}} #FFFFFF; background: {{p.bg}}; color: {{p.fg}}; opacity: {{p.opacity}}; box-shadow: {{p.shadow}}; display: flex; align-items: center; justify-content: center; font-family: 'Barlow', sans-serif; font-size: 11px; font-weight: 700; cursor: pointer">{{p.mark}}</button>
</sc-for>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: #4A5650">
<sc-for list="{{legend}}" as="l" hint-placeholder-count="7">
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 999px; background: {{l.bg}}"></span>{{l.label}}</span>
</sc-for>
<span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 999px; border: 2px dashed #4A5650"></span>Masqué dans l’app</span>
</div>
</section>

<aside style="flex: 1 1 360px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

<sc-if value="{{hasSel}}" hint-placeholder-val="{{true}}">
<section aria-label="Repère sélectionné" style="background: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 36px; height: 36px; flex: none; border-radius: 999px; background: {{selBg}}; color: {{selFg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{selMark}}</span>
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Repère sélectionné</h2>
</div>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700">Nom affiché dans l’app
<input id="repere-nom" type="text" value="{{selName}}" onChange="{{setName}}" style="height: 44px; box-sizing: border-box; border: 2px solid #D9DDD5; border-radius: 10px; padding: 0 12px; background: #FFFFFF; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 600">
</label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700">Catégorie
<button type="button" aria-haspopup="listbox" style="height: 44px; box-sizing: border-box; border: 2px solid #D9DDD5; border-radius: 10px; padding: 0 10px; background: #FFFFFF; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 15px; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; cursor: pointer"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{selCatLabel}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M6 9l6 6 6-6"></path></svg></button>
</label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700">Description
<textarea rows="2" style="box-sizing: border-box; border: 2px solid #D9DDD5; border-radius: 10px; padding: 8px 12px; background: #FFFFFF; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 15px; resize: vertical">{{selDesc}}</textarea>
</label>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; min-width: 0">Poste bénévole
<button type="button" aria-haspopup="listbox" style="height: 44px; box-sizing: border-box; border: 2px solid #D9DDD5; border-radius: 10px; padding: 0 10px; background: #FFFFFF; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 14px; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; cursor: pointer"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{selPoste}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M6 9l6 6 6-6"></path></svg></button>
</label>
<label style="display: flex; flex-direction: column; gap: 4px; font-size: 13px; font-weight: 700; min-width: 0">Partenaire
<button type="button" aria-haspopup="listbox" style="height: 44px; box-sizing: border-box; border: 2px solid #D9DDD5; border-radius: 10px; padding: 0 10px; background: #FFFFFF; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 14px; text-align: left; display: flex; align-items: center; justify-content: space-between; gap: 6px; min-width: 0; cursor: pointer"><span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{selPartner}}</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M6 9l6 6 6-6"></path></svg></button>
</label>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<button type="button" role="switch" aria-checked="{{selVisibleStr}}" aria-label="Visible dans l’app" onClick="{{toggleVisible}}" style="width: 52px; height: 32px; flex: none; border: 0; border-radius: 999px; background: {{switchBg}}; padding: 3px; display: flex; justify-content: {{switchJustify}}; cursor: pointer"><span style="width: 26px; height: 26px; border-radius: 999px; background: #FFFFFF"></span></button>
<span style="font-size: 14px; font-weight: 600">{{visibleText}}</span>
</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" style="height: 44px; padding: 0 14px; border: 2px solid #14201B; border-radius: 12px; background: #FFFFFF; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Code QR de ce lieu</button>
<button type="button" onClick="{{removeSel}}" style="height: 44px; padding: 0 14px; border: 2px solid #C81E1E; border-radius: 12px; background: #FFFFFF; color: #C81E1E; font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Retirer le repère</button>
</div>
</section>
</sc-if>
<sc-if value="{{noSel}}" hint-placeholder-val="{{false}}">
<section style="background: #FFFFFF; border-radius: 20px; padding: 18px; font-size: 15px; color: #4A5650">Clique un repère sur le plan pour le modifier, ou ajoute-en un avec les boutons au-dessus du plan.</section>
</sc-if>

<section aria-label="Affiche imprimée et codes QR" style="background: #14201B; color: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; gap: 14px; align-items: center">
<svg width="76" height="76" viewBox="0 0 21 21" aria-hidden="true" style="flex: none; background: #FFFFFF; border-radius: 8px; padding: 6px; box-sizing: content-box" shape-rendering="crispEdges">
<path d="M0 0h7v7H0zM1 1v5h5V1zM2 2h3v3H2zM14 0h7v7h-7zM15 1v5h5V1zM16 2h3v3h-3zM0 14h7v7H0zM1 15v5h5v-5zM2 16h3v3H2zM8 0h1v2H8zM10 1h2v1h-2zM9 3h3v1H9zM8 5h2v2H8zM11 5h1v3h-1zM0 8h2v1H0zM3 8h3v1H3zM8 8h2v2H8zM12 9h3v1h-3zM16 8h2v2h-2zM19 8h2v1h-2zM1 10h2v2H1zM5 10h2v1H5zM9 11h2v2H9zM13 11h1v3h-1zM15 11h3v1h-3zM19 11h1v3h-1zM8 14h3v1H8zM15 13h2v2h-2zM9 16h2v2H9zM12 15h2v1h-2zM17 16h3v1h-3zM14 17h2v2h-2zM8 19h3v2H8zM12 19h1v2h-1zM17 18h1v3h-1zM19 19h2v2h-2z" fill="#14201B"></path>
</svg>
<div style="min-width: 0">
<div style="font-size: 16px; font-weight: 700">Ton affiche 4 × 8 devient interactive</div>
<div style="font-size: 13px; color: #C9D2CC; line-height: 1.4; margin-top: 2px">Ajoute ce code QR sur le plan imprimé : on le scanne et le plan s’ouvre dans l’app. Un code par lieu aussi, pour les affiches des toilettes, de l’eau et des dossards.</div>
<div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px">
<button type="button" style="height: 40px; padding: 0 12px; border: 0; border-radius: 10px; background: #FF5B1A; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Télécharger le code QR</button>
<button type="button" style="height: 40px; padding: 0 12px; border: 2px solid #FFFFFF; border-radius: 10px; background: transparent; color: #FFFFFF; font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Codes par lieu ({{pinCount}})</button>
</div>
</div>
</section>

<section aria-label="Utilisation du plan" style="background: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">Les 7 derniers jours</h2>
<div style="display: flex; align-items: baseline; gap: 8px"><span style="font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 700; line-height: 1">1 204</span><span style="font-size: 14px; color: #4A5650">ouvertures du plan</span></div>
<div style="font-size: 14px; line-height: 1.5">Les plus cherchés : <strong>Toilettes</strong> (312), <strong>Dossards</strong> (288), <strong>Dépôt de sacs</strong> (190)</div>
<div style="font-size: 12px; color: #4A5650">Statistiques globales, sans données personnelles.</div>
</section>

</aside>
</div>
</sc-if>

<sc-if value="{{isRoute}}" hint-placeholder-val="{{false}}">
<sc-if value="{{notDrawing}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">

<section aria-label="Tracés des parcours" style="flex: 999 1 640px; min-width: 0; background: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px">
<h2 style="margin: 0; font-size: 18px; font-weight: 700">Tracés GPX</h2>
<div style="display: flex; gap: 8px; flex-wrap: wrap">
<button type="button" onClick="{{startDraw}}" style="height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #FF5B1A; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Tracer un parcours</button>
<button type="button" style="height: 44px; padding: 0 14px; border: 2px solid #14201B; border-radius: 12px; background: #FFFFFF; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Importer un GPX</button>
<button type="button" style="height: 44px; padding: 0 14px; border: 0; border-radius: 12px; background: #14201B; color: #FFFFFF; font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Exporter pour les montres</button>
</div>
</div>
<div role="group" aria-label="Distance" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px">
<sc-for list="{{races}}" as="r" hint-placeholder-count="4">
<button type="button" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="min-height: 76px; box-sizing: border-box; padding: 10px 12px; border-radius: 14px; border: 2px solid {{r.border}}; background: #FFFFFF; color: #14201B; font-family: 'Barlow', sans-serif; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 3px">
<span style="font-size: 16px; font-weight: 700">{{r.name}}</span>
<span style="font-size: 12px; color: #4A5650; overflow-wrap: anywhere">{{r.file}}</span>
<span style="align-self: flex-start; padding: 2px 8px; border-radius: 999px; background: {{r.chipBg}}; color: {{r.chipFg}}; font-size: 12px; font-weight: 700">{{r.status}}</span>
</button>
</sc-for>
</div>
<div style="position: relative; width: 100%; aspect-ratio: 338 / 196; border-radius: 12px; overflow: hidden; background: #EEF0EA">
<img src="carte-drummondville.svg" alt="" style="position: absolute; left: {{img.l}}%; top: {{img.t}}%; width: {{img.w}}%; height: {{img.h}}%; max-width: none; opacity: 0.85">
<svg viewBox="{{vb}}" preserveAspectRatio="none" role="img" aria-label="{{mapLabel}}" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block">
<path d="{{routeD}}" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
<path d="{{routeD}}" fill="none" stroke="#14201B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
</svg>
<sc-for list="{{mapLabels}}" as="l" hint-placeholder-count="6">
<span style="position: absolute; left: {{l.x}}%; top: {{l.y}}%; transform: translate(-50%, -50%) rotate({{l.r}}deg); font-size: 12px; font-weight: 600; font-style: {{l.style}}; letter-spacing: {{l.ls}}; color: {{l.color}}; white-space: nowrap; pointer-events: none; text-shadow: 0 0 2px #F3F4F0, 0 0 2px #F3F4F0, 0 0 4px #F3F4F0">{{l.t}}</span>
</sc-for>
<span aria-hidden="true" style="position: absolute; left: {{startX}}%; top: {{startY}}%; width: 24px; height: 24px; margin-left: -12px; margin-top: -12px; border-radius: 999px; background: #14201B; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4M6 4h11l-2.5 4L17 12H6"></path></svg></span>
<sc-for list="{{marks}}" as="m" hint-placeholder-count="6">
<span style="position: absolute; left: {{m.lx}}%; top: {{m.ty}}%; width: 24px; height: 24px; margin-left: -12px; margin-top: -12px; box-sizing: border-box; border-radius: {{m.radius}}; background: {{m.bg}}; border: 2px solid {{m.border}}; color: {{m.fg}}; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">{{m.mark}}</span>
</sc-for>
<span style="position: absolute; right: 6px; bottom: 4px; padding: 1px 6px; border-radius: 4px; background: rgba(255, 255, 255, 0.85); font-size: 11px; color: #4A5650">© les contributeurs d’OpenStreetMap · tracés officiels 2026</span>
</div>
<div style="position: relative; width: 100%; height: 90px">
<svg viewBox="0 0 338 72" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 90px; display: block">
<path d="{{profArea}}" fill="#FFE6D2"></path>
<path d="{{profLine}}" fill="none" stroke="#A33A00" stroke-width="2" vector-effect="non-scaling-stroke"></path>
</svg>
</div>
<div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-size: 13px; color: #4A5650"><span>0 km</span><span>{{profSummary}}</span><span>{{distLabel}}</span></div>
</section>

<aside style="flex: 1 1 380px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
<section aria-label="Points du parcours" style="background: #FFFFFF; border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px">

          warn = t ? t[1] : true;
        } else if (p.k === 'secours') team = 'Équipe médicale';
        else if (p.k === 'musique') team = 'Animation';
        else if (p.k === 'photo') team = 'Photographe';
        else if (p.k === 'toilettes') team = 'Fournisseur';
        else if (p.k === 'relais') team = 'Bénévoles relais';
        return { km: p.km, k: p.k, name: p.n, detail: p.d, team: team, warn: warn };
      });
      const rav = [0].concat(r.poi.filter((p) => p.k === 'ravito').map((p) => p.km)).concat([r.dist]);
      let gap = 0;
      for (let i = 1; i < rav.length; i++) gap = Math.max(gap, rav[i] - rav[i - 1]);
      const nRav = rav.length - 2;
      const missing = rows.filter((w) => w.k === 'ravito' && w.team === 'À assigner').length;
      const checks = [['ok', 'Tracé officiel 2026 importé (GPX), à confirmer pour 2027.']];
      checks.push([gap > 6 ? 'warn' : 'ok', (nRav ? nRav + (nRav > 1 ? ' ravitos' : ' ravito') : 'Aucun ravito') + ' · plus long écart sans eau : ' + fmt(gap) + ' km.']);
      rows.filter((w) => w.k === 'ravito' && w.warn && w.team !== 'À assigner').forEach((w) => checks.push(['warn', w.name + ' : il manque 3 bénévoles.']));
      if (missing) checks.push(['warn', missing + (missing > 1 ? ' ravitos n’ont' : ' ravito n’a') + ' pas encore d’équipe de bénévoles.']);
      return Object.assign({}, r, { rows: rows, checks: checks });
    });
    const race = RACES.find((r) => r.id === (st.race || '21')) || RACES[3];
    const D = race.dist;
    const P = race.pts;
    const at = (k) => {
      if (k <= P[0][2]) return { x: P[0][0], y: P[0][1] };
      let lo = 0, hi = P.length - 1;
      if (k >= P[hi][2]) return { x: P[hi][0], y: P[hi][1] };
      while (hi - lo > 1) { const m = (lo + hi) >> 1; if (P[m][2] < k) lo = m; else hi = m; }
      const a = P[lo], b = P[hi];
      const t = (k - a[2]) / ((b[2] - a[2]) || 1);
      return { x: a[0] + (b[0] - a[0]) * t, y: a[1] + (b[1] - a[1]) * t };
    };
    const asp = 338 / 196;
    const bb = race.bbox, pad = 60;
    let cw = bb[2] - bb[0] + pad * 2, ch = bb[3] - bb[1] + pad * 2;
    if (cw / ch > asp) ch = cw / asp; else cw = ch * asp;
    let cx0 = Math.max(0, Math.min(DATA.map.w - cw, (bb[0] + bb[2]) / 2 - cw / 2));
    let cy0 = Math.max(0, Math.min(DATA.map.h - ch, (bb[1] + bb[3]) / 2 - ch / 2));
    const pctX = (x) => (x - cx0) / cw * 100;
    const pctY = (y) => (y - cy0) / ch * 100;
    const placed = [], used = {}, mapLabels = [];
    DATA.labels
      .slice()
      .sort((a, b) => (a.w ? -2 : a.q ? -1 : a.p) - (b.w ? -2 : b.q ? -1 : b.p))
      .forEach((l) => {
        const x = pctX(l.x), y = pctY(l.y);
        if (x < 6 || x > 94 || y < 5 || y > 92 || used[l.t] || mapLabels.length >= 10) return;
        if (placed.some((q) => Math.abs(q[0] - x) < 12 && Math.abs(q[1] - y) < 6)) return;
        placed.push([x, y]);
        used[l.t] = true;
        let r = l.r;
        if (r > 90) r -= 180;
        if (r < -90) r += 180;
        mapLabels.push({ t: l.q ? l.t.toUpperCase() : l.t, x: x.toFixed(2), y: y.toFixed(2), r: r, style: l.w ? 'italic' : 'normal', color: l.w ? '#3F6E89' : '#56615B', ls: l.q ? '0.08em' : '0' });
      });
    const A = race.alt;
    const altAt = (k) => {
      if (k <= A[0][0]) return A[0][1];
      for (let i = 1; i < A.length; i++) {
        if (k <= A[i][0]) return A[i - 1][1] + (A[i][1] - A[i - 1][1]) * (k - A[i - 1][0]) / ((A[i][0] - A[i - 1][0]) || 1);
      }
      return A[A.length - 1][1];
    };
    const alts = A.map((a) => a[1]);
    let lo = Math.min.apply(null, alts) - 4, hi = Math.max.apply(null, alts) + 4;
    if (hi - lo < 30) { const mid = (hi + lo) / 2; lo = mid - 15; hi = mid + 15; }
    const py = (a) => 68 - (a - lo) / (hi - lo) * 58;
    const samples = [];
    for (let i = 0; i <= 84; i++) samples.push((338 * i / 84).toFixed(1) + ' ' + py(altAt(D * i / 84)).toFixed(1));
    const profLine = 'M' + samples.join(' L');
    let gain = 0;
    for (let i = 1; i < A.length; i++) gain += Math.max(0, A[i][1] - A[i - 1][1]);
    const KIND = {
      ravito: { bg: '#FFFFFF', fg: '#14201B', border: '#14201B', radius: '999px', mark: 'R' },
      secours: { bg: '#C81E1E', fg: '#FFFFFF', border: '#FFFFFF', radius: '6px', mark: '+' },
      musique: { bg: '#5B3BB5', fg: '#FFFFFF', border: '#FFFFFF', radius: '999px', mark: '♪' },
      photo: { bg: '#3F6273', fg: '#FFFFFF', border: '#FFFFFF', radius: '999px', mark: 'P' }
    };

    // ---------- Mode tracé : l'organisateur dessine son parcours sur la carte ----------
    const drawing = st.drawing === true;
    const START = DATA.map.start;
    const wp = st.wp || [START];
    const goal = st.goal || 10;
    const dasp = 338 / 196;
    const dcw = 1500, dch = dcw / dasp;
    const dcx0 = Math.max(0, Math.min(DATA.map.w - dcw, 1150 - dcw / 2));
    const dcy0 = Math.max(0, Math.min(DATA.map.h - dch, 1620 - dch / 2));
    const dpx = (x) => (x - dcx0) / dcw * 100;
    const dpy = (y) => (y - dcy0) / dch * 100;
    let dUnits = 0;
    const segs = [];
    for (let i = 1; i < wp.length; i++) {
      const len = Math.hypot(wp[i][0] - wp[i - 1][0], wp[i][1] - wp[i - 1][1]);
      segs.push({ a: wp[i - 1], b: wp[i], len: len, start: dUnits });
      dUnits += len;
    }
    const drawn = dUnits * 4 / 1000;
    const dkms = [];
    for (let k = 1; k < drawn; k++) {
      const u = k * 1000 / 4;
      const g = segs.find((x) => u >= x.start && u <= x.start + x.len);
      if (!g) continue;
      const t = (u - g.start) / (g.len || 1);
      dkms.push({ label: String(k), x: dpx(g.a[0] + (g.b[0] - g.a[0]) * t).toFixed(2), y: dpy(g.a[1] + (g.b[1] - g.a[1]) * t).toFixed(2) });
    }
    const dplaced = [], dused = {}, dlabels = [];
    DATA.labels.slice().sort((a, b) => (a.w ? -2 : a.q ? -1 : a.p) - (b.w ? -2 : b.q ? -1 : b.p)).forEach((l) => {
      const x = dpx(l.x), y = dpy(l.y);
      if (x < 6 || x > 94 || y < 5 || y > 92 || dused[l.t] || dlabels.length >= 12) return;
      if (dplaced.some((q) => Math.abs(q[0] - x) < 12 && Math.abs(q[1] - y) < 6)) return;
      dplaced.push([x, y]);
      dused[l.t] = true;
      let r = l.r;
      if (r > 90) r -= 180;
      if (r < -90) r += 180;
      dlabels.push({ t: l.q ? l.t.toUpperCase() : l.t, x: x.toFixed(2), y: y.toFixed(2), r: r, style: l.w ? 'italic' : 'normal', color: l.w ? '#3F6E89' : '#56615B', ls: l.q ? '0.08em' : '0' });
    });
    const gap = drawn - goal;
    const near = Math.abs(gap) <= goal * 0.02;
    const GOALS = [1, 2, 5, 10, 21.1, 42.2];
    return {
      publishNote: published ? 'Publié à l’instant · visible dans l’app' : 'Modifications non publiées',
      notDrawing: !drawing,
      drawing: drawing,
      startDraw: () => this.setState({ drawing: true, wp: [START], drawSaved: false }),
      stopDraw: () => this.setState({ drawing: false }),
      dimg: { l: (-dcx0 / dcw * 100).toFixed(3), t: (-dcy0 / dch * 100).toFixed(3), w: (DATA.map.w / dcw * 100).toFixed(3), h: (DATA.map.h / dch * 100).toFixed(3) },
      dvb: dcx0.toFixed(1) + ' ' + dcy0.toFixed(1) + ' ' + dcw.toFixed(1) + ' ' + dch.toFixed(1),
      dlabels: dlabels,
      drawD: 'M' + wp.map((p) => p[0] + ' ' + p[1]).join(' L'),
      dkms: dkms,
      wpts: wp.map((p, i) => {
        const first = i === 0, last = i === wp.length - 1 && i > 0;
        const size = first ? 22 : (last ? 20 : 14);
        return { x: dpx(p[0]).toFixed(2), y: dpy(p[1]).toFixed(2), size: size, off: -size / 2, bg: first ? '#14201B' : '#FF5B1A' };
      }),
      addPoint: (e) => {
        const el = e && (e.currentTarget || e.target);
        if (!el || !el.getBoundingClientRect || e.detail === 0) return;
        const r = el.getBoundingClientRect();
        const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
        this.setState({ wp: wp.concat([[Math.round(dcx0 + fx * dcw), Math.round(dcy0 + fy * dch)]]), drawSaved: false });
      },
      drawKm: fmt(drawn),
      drawPts: wp.length + (wp.length > 1 ? ' points de passage' : ' point : le départ'),
      goals: GOALS.map((g) => ({
        label: fmt(g) + ' km', pressed: g === goal ? 'true' : 'false',
        bg: g === goal ? '#14201B' : '#FFFFFF', fg: g === goal ? '#FFFFFF' : '#14201B', border: g === goal ? '#14201B' : '#D9DDD5',
        pick: () => this.setState({ goal: g })
      })),
      goalPct: Math.min(100, Math.round(drawn / goal * 100)),
      goalColor: near ? '#2E7D4F' : (gap > 0 ? '#C81E1E' : '#FF5B1A'),
      goalText: near ? 'Distance visée atteinte : ' + fmt(goal) + ' km.' : (gap < 0 ? 'Encore ' + fmt(-gap) + ' km pour atteindre ' + fmt(goal) + ' km.' : fmt(goal) + ' km dépassés de ' + fmt(gap) + ' km.'),
      cantUndo: wp.length < 2,
      undo: () => this.setState({ wp: wp.length > 1 ? wp.slice(0, -1) : wp, drawSaved: false }),
      closeLoop: () => this.setState({ wp: wp.concat([START]), drawSaved: false }),
      clearDraw: () => this.setState({ wp: [START], drawSaved: false }),
      saveDraw: () => this.setState({ drawSaved: true }),
      drawSaved: st.drawSaved === true,
      savedText: 'Tracé enregistré : ' + fmt(drawn) + ' km, ' + wp.length + ' points. Les kilomètres, le profil d’altitude et le GPX pour les montres sont prêts.',
      publish: () => this.setState({ published: true }),
      isPlan: view === 'plan',
      isRoute: view === 'route',
      planPressed: view === 'plan' ? 'true' : 'false',
      routePressed: view === 'route' ? 'true' : 'false',
      planTabBg: view === 'plan' ? '#FFFFFF' : 'transparent',
      routeTabBg: view === 'route' ? '#FFFFFF' : 'transparent',
      showPlan: () => this.setState({ view: 'plan' }),
      showRoute: () => this.setState({ view: 'route' }),

      pinCount: places.length,
      palette: [
        { label: 'Toilettes', cat: 'pratique' },
        { label: 'Point d’eau', cat: 'sante' },
        { label: 'Premiers soins', cat: 'sante' },
        { label: 'Information', cat: 'services' },
        { label: 'Partenaire', cat: 'partenaires' },
        { label: 'Famille', cat: 'famille' }
      ].map((t) => ({
        label: t.label,
        bg: catOf[t.cat].bg,
        fg: catOf[t.cat].fg,
        add: () => {
          const spot = SPOTS[added.length % SPOTS.length];
          const id = 'nouveau-' + (added.length + 1);
          this.setState({ added: added.concat([{ id: id, cat: t.cat, x: spot[0], y: spot[1], name: t.label + ' (nouveau)', desc: '' }]), sel: id, published: false });
        }
      })),
      pins: places.map((p) => {
        const on = selP && p.id === selP.id;
        const c = catOf[p.cat];
        const isHidden = !!hidden[p.id];
        const size = on ? 34 : 26;
        return {
          aria: nameOf(p) + (isHidden ? ' (masqué)' : ''),
          lx: (p.x / 20).toFixed(2),
          ty: (p.y / 10).toFixed(2),
          size: size,
          offset: -size / 2,
          bg: isHidden ? '#FFFFFF' : c.bg,
          fg: isHidden ? '#4A5650' : c.fg,
          borderStyle: isHidden ? 'dashed' : 'solid',
          opacity: isHidden ? 0.85 : 1,
          shadow: on ? '0 0 0 4px #FF5B1A, 0 2px 6px rgba(0, 0, 0, 0.5)' : '0 1px 4px rgba(0, 0, 0, 0.5)',
          mark: markOf(p),
          pressed: on ? 'true' : 'false',
          pick: () => this.setState({ sel: p.id })
        };
      }),
      legend: CATS.map((c) => ({ label: c.label, bg: c.bg })),
      hasSel: !!selP,
      noSel: !selP,
      selBg: selP ? catOf[selP.cat].bg : '#14201B',
      selFg: selP ? catOf[selP.cat].fg : '#FFFFFF',
      selMark: selP ? markOf(selP) : '',
      selName: selP ? nameOf(selP) : '',
      selDesc: selP ? selP.desc : '',
      setName: (e) => {
        const next = Object.assign({}, names);
        next[selP.id] = e.target.value;
        this.setState({ names: next, published: false });
      },
      selCatLabel: selP ? catOf[selP.cat].label : '',
      selPoste: selP ? (selP.poste || 'Aucun') : '',
      selPartner: selP ? (selP.partner || 'Aucun') : '',
      selVisibleStr: selVisible ? 'true' : 'false',
      switchBg: selVisible ? '#2E7D4F' : '#7D8781',
      switchJustify: selVisible ? 'flex-end' : 'flex-start',
      visibleText: selVisible ? 'Visible dans l’app des participants' : 'Masqué dans l’app (visible ici seulement)',
      toggleVisible: () => {
        const next = Object.assign({}, hidden);
        next[selP.id] = selVisible;
        this.setState({ hidden: next, published: false });
      },
      removeSel: () => {
        const next = Object.assign({}, removed);
        next[selP.id] = true;
        this.setState({ removed: next, sel: null, published: false });
      },

      races: RACES.map((r) => {
        const on = r.id === race.id;
        return {
          name: r.name,
          file: 'Tracé officiel 2026 · ' + fmt(r.dist) + ' km · ' + r.pts.length + ' points',
          status: 'Tracé 2026 importé',
          chipBg: '#E3F1E8',
          chipFg: '#14201B',
          border: on ? '#14201B' : '#D9DDD5',
          pressed: on ? 'true' : 'false',
          pick: () => this.setState({ race: r.id })
        };
      }),
      mapLabel: 'Carte de Drummondville avec le tracé ' + race.name.toLowerCase() + ' et ses ' + race.rows.length + ' points.',
      img: { l: (-cx0 / cw * 100).toFixed(3), t: (-cy0 / ch * 100).toFixed(3), w: (DATA.map.w / cw * 100).toFixed(3), h: (DATA.map.h / ch * 100).toFixed(3) },
      vb: cx0.toFixed(1) + ' ' + cy0.toFixed(1) + ' ' + cw.toFixed(1) + ' ' + ch.toFixed(1),
      mapLabels: mapLabels,
      startX: pctX(DATA.map.start[0]).toFixed(2),
      startY: pctY(DATA.map.start[1]).toFixed(2),
      routeD: 'M' + P.map((p) => p[0] + ' ' + p[1]).join(' L'),
      marks: race.poi.filter((p) => KIND[p.k]).map((p) => {
        const q = at(p.km);
        const k = KIND[p.k];
        return { lx: pctX(q.x).toFixed(2), ty: pctY(q.y).toFixed(2), bg: k.bg, fg: k.fg, border: k.border, radius: k.radius, mark: k.mark };
      }),
      profLine: profLine,
      profArea: profLine + ' L338 72 L0 72 Z',
      profSummary: 'Altitude de ' + Math.min.apply(null, alts) + ' à ' + Math.max.apply(null, alts) + ' m · ' + Math.round(gain) + ' m de montée au total',
      distLabel: fmt(D) + ' km',
      rows: race.rows.map((p) => ({
        km: fmt(p.km),
        name: p.name,
        detail: p.detail,
        team: p.team,
        teamBg: p.warn ? '#FFE6D2' : '#EEF0EA',
        teamFg: p.warn ? '#A33A00' : '#14201B'
      })),
      checks: race.checks.map((c) => ({
        icon: c[0] === 'ok' ? '✓' : '!',
        state: c[0] === 'ok' ? 'Conforme' : 'À corriger',
        bg: c[0] === 'ok' ? '#E3F1E8' : '#FFE6D2',
        fg: c[0] === 'ok' ? '#2E7D4F' : '#A33A00',
        text: c[1]
      }))
    };
  }
}
</script>
