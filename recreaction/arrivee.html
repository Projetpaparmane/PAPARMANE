<div>
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.1em">ÉDITION 2028 · AUJOURD’HUI SEULEMENT</div>
<h2 id="t-2028" style="margin: 2px 0 0; font-size: 21px; font-weight: 700; line-height: 1.2">Réserve ta place pour l’an prochain</h2>
</div>
<sc-if value="{{notReserved}}" hint-placeholder-val="{{true}}">
<div role="group" aria-label="Distance en 2028" style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{options}}" as="o" hint-placeholder-count="5">
<button type="button" onClick="{{o.pick}}" aria-pressed="{{o.pressed}}" style="height: 40px; padding: 0 12px; border-radius: 999px; border: 2px solid #14201B; background: {{o.bg}}; color: {{o.fg}}; font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">{{o.label}}</button>
</sc-for>
</div>
<div style="display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap">
<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 36px; font-weight: 700; line-height: 1">{{price}}</span>
<span style="font-size: 15px; font-weight: 600">au lieu de <span style="text-decoration: line-through">{{full}}</span></span>
<span style="margin-left: auto; font-size: 13px; font-weight: 700">Prix finissant jusqu’à minuit</span>
</div>
<button type="button" onClick="{{reserve}}" style="height: 50px; border: 0; border-radius: 14px; background: #14201B; color: #FFFFFF; font-family: 'Barlow', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer">Je réserve ma place 2028</button>
</sc-if>
<sc-if value="{{reserved}}" hint-placeholder-val="{{false}}">
<div role="status" style="background: #FFFFFF; border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 999px; background: #2E7D4F; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
<strong style="font-size: 17px">C’est réservé!</strong>
</div>
<div style="font-size: 14px; line-height: 1.4">{{resText}}</div>
<button type="button" style="height: 44px; border: 2px solid #14201B; border-radius: 12px; background: transparent; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">Inviter un ami · -20 % pour lui aussi</button>
</div>

<a href="suggestions.html" style="background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: #14201B">

<span style="flex-grow: 1; min-width: 0">

<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M9 5l7 7-7 7"></path></svg>

<a href="dossard.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5C6862; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 28px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"></rect><path d="M8 10h8"></path><path d="M8 14h5"></path></svg></span><span>Dossard</span></a>

</nav>

</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const pick = st.dist || 'demi';
    const reserved = st.reserved === true;
    const OPTIONS = [
      { id: 'renald', label: 'M. Renald', name: 'Course de M. Renald', price: 15 },
      { id: '5', label: '5 km', name: '5 km', price: 35 },
      { id: '10', label: '10 km', name: '10 km', price: 55 },
      { id: 'demi', label: 'Demi', name: 'Demi-marathon', price: 75 },
      { id: '42', label: 'Marathon', name: 'Marathon', price: 110 }
    ];
    const sel = OPTIONS.find((o) => o.id === pick) || OPTIONS[3];
    const finisher = Math.round(sel.price * 0.8);
    return {
      options: OPTIONS.map((o) => {
        const on = o.id === sel.id;
        return {
          label: o.label,
          pressed: on ? 'true' : 'false',
          bg: on ? '#14201B' : '#FFFFFF',
          fg: on ? '#FFFFFF' : '#14201B',
          pick: () => this.setState({ dist: o.id })
        };
      }),
      price: finisher + ' $',
      full: sel.price + ' $',
      notReserved: !reserved,
      reserved: reserved,
      reserve: () => this.setState({ reserved: true }),
      resText: 'Ta place ' + (sel.id === 'renald' ? 'à la Course de M. Renald' : 'au ' + sel.name.toLowerCase()) + ' 2028 est réservée à ' + finisher + ' $. On te confirme la date dès qu’elle est annoncée.'
    };
  }
}
</script>
