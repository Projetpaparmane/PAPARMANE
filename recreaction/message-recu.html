<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Message vocal reçu en course · Récréaction</title>

a{color:#14201B}a:hover{color:#000000}
</style>

</head>
<body>
<a class="proto-home" href="index.html">Tous les écrans</a>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0EA; color: #14201B; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="flex: none; display: flex; align-items: center; justify-content: space-between; padding: 20px 16px 6px">
<div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #A33A00"><span style="width: 8px; height: 8px; border-radius: 999px; background: #FF5B1A"></span>EN COURSE · KM 20,1</div>
<div style="margin-top: 2px; font-size: 20px; font-weight: 700">Des-Chênes-Toi! · demi-marathon</div>
</div>
<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; background: #14201B; color: #FF5B1A; border-radius: 10px; padding: 3px 10px">0512</span>
</header>

<main style="flex: 1; min-height: 0; overflow: hidden; padding: 6px 16px 12px; display: flex; flex-direction: column; gap: 12px">

<section aria-label="Message vocal reçu" style="background: #14201B; color: #FFFFFF; border-radius: 24px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; letter-spacing: 0.12em; color: #FF5B1A"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg>MESSAGE VOCAL · KM 20</div>
<h1 style="margin: 0; font-size: 28px; font-weight: 700; line-height: 1.15">Léa t’encourage</h1>
<div style="display: flex; align-items: center; gap: 14px">
<button type="button" onClick="{{togglePlay}}" aria-label="{{playLabel}}" style="width: 64px; height: 64px; flex: none; border: 0; border-radius: 999px; background: #FF5B1A; color: #14201B; display: flex; align-items: center; justify-content: center; cursor: pointer">
<sc-if value="{{playing}}" hint-placeholder-val="{{true}}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"></rect><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"></rect></svg></sc-if>
<sc-if value="{{paused}}" hint-placeholder-val="{{false}}"><svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l12 7-12 7z" fill="currentColor"></path></svg></sc-if>
</button>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 2px; height: 36px; overflow: hidden">
<sc-for list="{{bars}}" as="b" hint-placeholder-count="20"><span style="flex: none; width: 3px; border-radius: 2px; height: {{b.h}}; background: {{b.c}}"></span></sc-for>
</div>
<div style="display: flex; justify-content: space-between; font-size: 13px; color: #C9D2CC"><span>{{elapsed}}</span><span>0:06</span></div>
</div>
</div>
<blockquote style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 700; line-height: 1.05">« Continue papa! Tu es capable! »</blockquote>
<div style="font-size: 13px; color: #C9D2CC">Joué dans tes écouteurs à 1 km de l’arrivée.</div>
<sc-if value="{{notThanked}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{thank}}" style="width: 100%; height: 48px; border: 0; border-radius: 14px; background: #FFFFFF; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="#C81E1E" aria-hidden="true"><path d="M12 20s-7-4.4-9-9a4.8 4.8 0 0 1 9-3 4.8 4.8 0 0 1 9 3c-2 4.6-9 9-9 9z"></path></svg>Envoyer un cœur à Léa</button>
</sc-if>
<sc-if value="{{thanked}}" hint-placeholder-val="{{false}}">
<div role="status" style="display: flex; align-items: center; gap: 10px; min-height: 48px; box-sizing: border-box; padding: 8px 12px; border-radius: 14px; background: #22332C; font-size: 14px"><svg width="18" height="18" viewBox="0 0 24 24" fill="#FF5B1A" aria-hidden="true" style="flex: none"><path d="M12 20s-7-4.4-9-9a4.8 4.8 0 0 1 9-3 4.8 4.8 0 0 1 9 3c-2 4.6-9 9-9 9z"></path></svg>Léa verra : « Papa a écouté ton message! »</div>
</sc-if>
</section>

<section style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-size: 16px; font-weight: 700">D’autres encouragements t’attendent</h2>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; font-size: 14px">
<li style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 999px; background: #EEF0EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#14201B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><path d="M12 18v3"></path></svg></span>
<span style="flex-grow: 1"><strong>Marie</strong> · message vocal</span>
<span style="font-size: 12px; color: #4A5650">à 1 km de l’arrivée</span>
</li>
<li style="display: flex; align-items: center; gap: 10px">
<span aria-hidden="true" style="width: 32px; height: 32px; flex: none; border-radius: 999px; background: #EEF0EA; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#14201B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg></span>
<span style="flex-grow: 1"><strong>Collègues du bureau</strong> · 4 messages</span>
<span style="font-size: 12px; color: #4A5650">à l’arrivée</span>
</li>
</ul>
</section>

<div style="display: flex; align-items: center; gap: 8px; font-size: 12px; color: #4A5650"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"></path></svg>Les messages ne coupent jamais les alertes de sécurité.</div>

</main>

<a href="dossard.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5C6862; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 28px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"></rect><path d="M8 10h8"></path><path d="M8 14h5"></path></svg></span><span>Dossard</span></a>
<a href="photos.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5C6862; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 28px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span><span>Photos</span></a>
<a href="avantages.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5C6862; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 28px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="8.5" r="1.5"></circle></svg></span><span>Avantages</span></a>
</nav>

</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const playing = st.playing !== false;
    const thanked = st.thanked === true;
    const played = playing ? 30 : 44;
    const bars = [];
    for (let i = 0; i < 44; i++) {
      const h = 6 + Math.round(Math.abs(Math.sin(i * 0.9) * Math.cos(i * 0.37)) * 28);
      bars.push({ h: h + 'px', c: i < played ? '#FF5B1A' : '#5C6E66' });
    }
    return {
      bars: bars,
      playing: playing,
      paused: !playing,
      playLabel: playing ? 'Mettre en pause' : 'Réécouter',
      elapsed: playing ? '0:04' : '0:06',
      togglePlay: () => this.setState({ playing: !playing }),
      thanked: thanked,
      notThanked: !thanked,
      thank: () => this.setState({ thanked: true })
    };
  }
}
</script>
</body>
