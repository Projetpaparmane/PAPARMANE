<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    return {
      sheet: st.sheet === true,
      openSheet: () => this.setState({ sheet: true, copied: false }),
      closeSheet: () => this.setState({ sheet: false }),
      copyLabel: st.copied ? 'Adresse copiée' : 'Copier l’adresse',
      copy: () => {
        try { if (navigator.clipboard) navigator.clipboard.writeText('École Marie-Rivier, 265 rue Saint-Félix, Drummondville (Québec) J2C 5M1'); } catch (e) { /* presse-papiers indisponible */ }
        this.setState({ copied: true });
      },
    };
  }
}
</script>
