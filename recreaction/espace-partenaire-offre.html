<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mon offre de partenaire · Récréaction</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14201B}a:hover{color:#000000}
</style>
<link rel="stylesheet" href="prototype.css">
<script src="runtime.js" defer></script>
</head>
<body>
<a class="proto-home" href="index.html">Tous les écrans</a>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0EA; color: #14201B; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="flex: none; display: flex; align-items: center; gap: 6px; padding: 20px 12px 4px">
<a href="espace-partenaire.html" aria-label="Retour à l’espace partenaire" style="width: 44px; height: 44px; flex: none; border-radius: 999px; color: #14201B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex-grow: 1">
<h1 style="margin: 0; font-size: 20px; font-weight: 700">Mon offre</h1>
<div style="font-size: 13px; color: #4A5650">Des-Chênes-Toi! 2027 · sac du coureur</div>
</div>
</header>

<main style="flex: 1; min-height: 0; overflow: hidden; padding: 6px 16px 12px; display: flex; flex-direction: column; gap: 12px">

<div style="display: flex; flex-direction: column; gap: 4px">
<label for="titre" style="font-size: 14px; font-weight: 700">Ce que tu offres</label>
<input id="titre" type="text" value="{{title}}" onChange="{{setTitle}}" style="height: 46px; box-sizing: border-box; border: 2px solid #D9DDD5; border-radius: 12px; padding: 0 12px; background: #FFFFFF; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 16px">
</div>

<div role="group" aria-label="Rabais" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 700">Rabais</span>
<div style="display: flex; gap: 8px">
<sc-for list="{{discounts}}" as="d" hint-placeholder-count="4">
<button type="button" aria-pressed="{{d.pressed}}" onClick="{{d.pick}}" style="flex: 1; height: 44px; border-radius: 999px; border: 2px solid {{d.border}}; background: {{d.bg}}; color: {{d.fg}}; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">{{d.label}}</button>
</sc-for>
</div>
</div>

<div role="group" aria-label="Pour qui" style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 700">Pour qui</span>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{audiences}}" as="a" hint-placeholder-count="3">
<button type="button" aria-pressed="{{a.pressed}}" onClick="{{a.pick}}" style="height: 40px; padding: 0 12px; border-radius: 999px; border: 2px solid {{a.border}}; background: {{a.bg}}; color: {{a.fg}}; font-family: 'Barlow', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer">{{a.label}}</button>
</sc-for>
</div>
<span style="font-size: 12px; color: #4A5650">Une utilisation par participant, validée à ton comptoir.</span>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 700">Aperçu dans l’app</span>
<article style="background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start">
<span aria-hidden="true" style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: #7A4A2A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700">TH</span>
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
<span style="font-size: 13px; font-weight: 600; color: #4A5650">Tim Hortons</span>
<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 19px; font-weight: 700; line-height: 1.3; background: #FF5B1A; color: #14201B; border-radius: 8px; padding: 0 8px">{{discountLabel}}</span>
</div>
<div style="font-size: 15px; font-weight: 700; line-height: 1.25">{{titleOrPlaceholder}}</div>
<div style="font-size: 12px; color: #4A5650">{{audienceText}}</div>
</div>
</article>
</div>

<sc-if value="{{notSent}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{send}}" style="height: 54px; border: 0; border-radius: 14px; background: #FF5B1A; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 17px; font-weight: 700; cursor: pointer">Envoyer pour approbation</button>
</sc-if>
<sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
<div role="status" style="display: flex; align-items: center; gap: 10px; background: #E3F1E8; border-radius: 14px; padding: 12px 14px; font-size: 14px; line-height: 1.35"><span aria-hidden="true" style="width: 28px; height: 28px; flex: none; border-radius: 999px; background: #2E7D4F; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5L20 7"></path></svg></span><span>Envoyée. L’organisateur l’approuve avant la mise en ligne.</span></div>
</sc-if>

</main>

<nav aria-label="Navigation partenaire" style="flex: none; height: 80px; box-sizing: border-box; padding: 6px 6px 20px; background: #FFFFFF; border-top: 1px solid #D9DDD5; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
<a href="espace-partenaire.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5C6862; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 28px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg></span><span>Accueil</span></a>
<a href="espace-partenaire-valider.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5C6862; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 28px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"></path><path d="M7 12h10"></path></svg></span><span>Valider</span></a>
<a href="espace-partenaire-offre.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #14201B; font-size: 11px; font-weight: 700"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 28px; border-radius: 999px; background: #FF5B1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="8.5" r="1.5"></circle></svg></span><span>Mon offre</span></a>
</nav>

</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const title = st.title === undefined ? 'Déjeuner sur présentation du dossard numérique' : st.title;
    const discount = st.discount || 20;
    const audience = st.audience || 'ext';
    const sent = st.sent === true;
    const chip = (on) => ({ pressed: on ? 'true' : 'false', bg: on ? '#14201B' : '#FFFFFF', fg: on ? '#FFFFFF' : '#14201B', border: on ? '#14201B' : '#D9DDD5' });
    const audienceDefs = [
      { id: 'tous', label: 'Tous les participants', text: 'Offre ouverte à tous les participants' },
      { id: 'ext', label: 'Gens de l’extérieur', text: 'Pour les participants qui viennent de l’extérieur de la région' },
      { id: 'apres', label: 'Après la course', text: 'Après ta course, sur présentation du dossard' }
    ];
    const aud = audienceDefs.find((a) => a.id === audience) || audienceDefs[1];
    return {
      title: title,
      titleOrPlaceholder: title.trim() || 'Ton offre',
      setTitle: (e) => this.setState({ title: e.target.value, sent: false }),
      discounts: [10, 15, 20, 25].map((d) => ({ label: d + ' %', ...chip(d === discount), pick: () => this.setState({ discount: d, sent: false }) })),
      discountLabel: '-' + discount + ' %',
      audiences: audienceDefs.map((a) => ({ label: a.label, ...chip(a.id === aud.id), pick: () => this.setState({ audience: a.id, sent: false }) })),
      audienceText: aud.text,
      sent: sent,
      notSent: !sent,
      send: () => this.setState({ sent: true })
    };
  }
}
</script>
</body>
</html>
