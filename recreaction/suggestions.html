<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Suggestions pour 2028 · Récréaction</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14201B}a:hover{color:#000000}
</style>
<link rel="stylesheet" href="prototype.css">
<script src="runtime.js" defer></script>
</head>
<body>
<a class="proto-home" href="index.html">Tous les écrans</a>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0EA; color: #14201B; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="flex: none; display: flex; align-items: center; gap: 6px; padding: 20px 12px 6px">
<a href="arrivee.html" aria-label="Retour" style="width: 44px; height: 44px; flex: none; border-radius: 999px; color: #14201B; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
<div style="flex-grow: 1">
<h1 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.15">Tes idées pour 2028</h1>
<div style="font-size: 14px; color: #4A5650">Course Des-Chênes-Toi! · l’organisation lit tout</div>
</div>
</header>

<main style="flex: 1; min-height: 0; overflow-y: auto; padding: 4px 16px 12px; display: flex; flex-direction: column; gap: 10px">

<section aria-label="Proposer une idée" style="flex: none; background: #FFFFFF; border-radius: 18px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px">
<label for="idee" style="font-size: 15px; font-weight: 700">Qu’est-ce qu’on améliore l’an prochain?</label>
<div role="group" aria-label="Sujet de ton idée" style="display: flex; gap: 6px; overflow-x: auto; margin: 0 -14px; padding: 0 14px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="6">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="flex: none; height: 36px; padding: 0 12px; border-radius: 999px; border: 2px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-family: 'Barlow', sans-serif; font-size: 13px; font-weight: 700; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
<textarea id="idee" rows="2" maxlength="140" value="{{text}}" onChange="{{setText}}" placeholder="Ex. : un point d’eau de plus au km 15" style="box-sizing: border-box; border: 2px solid #D9DDD5; border-radius: 12px; padding: 8px 12px; background: #FFFFFF; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 15px; resize: none"></textarea>
<div style="display: flex; align-items: center; gap: 10px">
<span style="flex-grow: 1; font-size: 12px; color: #4A5650">{{count}} / 140 · visible par les autres coureurs</span>
<button type="button" onClick="{{publish}}" disabled="{{empty}}" style="height: 44px; padding: 0 16px; border: 0; border-radius: 12px; background: {{publishBg}}; color: {{publishFg}}; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">Publier</button>
</div>
<sc-if value="{{sent}}" hint-placeholder-val="{{false}}">
<div role="status" style="font-size: 14px; font-weight: 600; color: #2E7D4F">Merci! Ton idée est publiée. Les autres coureurs peuvent l’appuyer.</div>
</sc-if>
</section>

<div style="flex: none; display: flex; align-items: baseline; justify-content: space-between">
<h2 style="margin: 0; font-size: 17px; font-weight: 700">Les plus appuyées</h2>
<span style="font-size: 13px; color: #4A5650">{{total}} idées</span>
</div>

<sc-for list="{{ideas}}" as="i" hint-placeholder-count="4">
<article style="flex: none; background: #FFFFFF; border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="padding: 1px 8px; border-radius: 999px; background: #EEF0EA; font-size: 12px; font-weight: 700">{{i.cat}}</span>
<span style="padding: 1px 8px; border-radius: 999px; background: {{i.statusBg}}; color: {{i.statusFg}}; font-size: 12px; font-weight: 700">{{i.status}}</span>
</div>
<div style="font-size: 15px; font-weight: 700; line-height: 1.3">{{i.text}}</div>
<sc-if value="{{i.hasReply}}" hint-placeholder-val="{{false}}">
<div style="font-size: 13px; line-height: 1.35; color: #4A5650"><strong style="color: #14201B">L’organisation :</strong> {{i.reply}}</div>
</sc-if>
</div>
<button type="button" onClick="{{i.vote}}" aria-pressed="{{i.pressed}}" aria-label="{{i.aria}}" style="width: 52px; flex: none; min-height: 52px; border: 2px solid #14201B; border-radius: 12px; background: {{i.voteBg}}; color: {{i.voteFg}}; font-family: 'Barlow', sans-serif; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 4px 0">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"></path></svg>
<span style="font-size: 14px; font-weight: 700">{{i.votes}}</span>
</button>
</article>
</sc-for>

</main>

<nav aria-label="Navigation principale" style="flex: none; height: 80px; box-sizing: border-box; padding: 6px 6px 20px; background: #FFFFFF; border-top: 1px solid #D9DDD5; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
<a href="accueil.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #14201B; font-size: 11px; font-weight: 700"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 28px; border-radius: 999px; background: #FF5B1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg></span><span>Accueil</span></a>
<a href="parcours.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5C6862; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 28px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2"></circle><circle cx="18" cy="6" r="2"></circle><path d="M8 18h6a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6"></path></svg></span><span>Parcours</span></a>
<a href="dossard.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5C6862; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 28px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"></rect><path d="M8 10h8"></path><path d="M8 14h5"></path></svg></span><span>Dossard</span></a>
<a href="photos.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5C6862; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 28px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span><span>Photos</span></a>
<a href="avantages.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5C6862; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 28px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="8.5" r="1.5"></circle></svg></span><span>Avantages</span></a>
</nav>

</div>
</template>
<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const cat = st.cat || 'site';
    const text = st.text || '';
    const voted = st.voted || {};
    const mine = st.mine || [];
    const CATS = [
      { id: 'site', label: 'Site et services' },
      { id: 'parcours', label: 'Parcours' },
      { id: 'ravitos', label: 'Ravitos' },
      { id: 'animation', label: 'Animation' },
      { id: 'renald', label: 'Course de M. Renald' },
      { id: 'autre', label: 'Autre' }
    ];
    const label = (id) => (CATS.find((c) => c.id === id) || CATS[5]).label;
    const STATUS = {
      retenue: { label: 'Retenue pour 2028', bg: '#E3F1E8', fg: '#1F5E3A' },
      etude: { label: 'À l’étude', bg: '#FFE6D2', fg: '#A33A00' },
      nouvelle: { label: 'Nouvelle', bg: '#E4E8E0', fg: '#14201B' }
    };
    const BASE = [
      { id: 'toilettes', cat: 'site', text: 'Plus de toilettes près du départ', votes: 124, status: 'retenue', reply: '12 toilettes de plus au départ en 2028.' },
      { id: 'musique', cat: 'animation', text: 'De la musique au km 15 du demi', votes: 87, status: 'etude' },
      { id: 'medaille', cat: 'renald', text: 'Une médaille spéciale pour la Course de M. Renald', votes: 64, status: 'nouvelle' },
      { id: 'oranges', cat: 'ravitos', text: 'Des oranges au ravito du km 30 du marathon', votes: 41, status: 'etude' }
    ];
    const all = mine.concat(BASE);
    const clean = text.trim();
    return {
      cats: CATS.map((c) => {
        const on = c.id === cat;
        return {
          label: c.label,
          pressed: on ? 'true' : 'false',
          bg: on ? '#14201B' : '#FFFFFF',
          fg: on ? '#FFFFFF' : '#14201B',
          border: on ? '#14201B' : '#D9DDD5',
          pick: () => this.setState({ cat: c.id })
        };
      }),
      text: text,
      count: text.length,
      setText: (e) => this.setState({ text: e.target.value.slice(0, 140), sent: false }),
      empty: clean.length === 0,
      publishBg: clean.length ? '#FF5B1A' : '#E4E8E0',
      publishFg: clean.length ? '#14201B' : '#4A5650',
      publish: () => {
        if (!clean) return;
        const idea = { id: 'mine-' + (mine.length + 1), cat: cat, text: clean, votes: 0, status: 'nouvelle', own: true };
        const nextVoted = Object.assign({}, voted);
        nextVoted[idea.id] = true;
        this.setState({ mine: [idea].concat(mine), text: '', sent: true, voted: nextVoted });
      },
      sent: st.sent === true,
      total: 86 + mine.length,
      ideas: all.map((i) => {
        const on = !!voted[i.id];
        const n = i.votes + (on ? 1 : 0);
        const s = STATUS[i.status];
        return {
          cat: label(i.cat),
          status: s.label,
          statusBg: s.bg,
          statusFg: s.fg,
          text: i.text,
          hasReply: !!i.reply,
          reply: i.reply || '',
          votes: n,
          pressed: on ? 'true' : 'false',
          aria: (on ? 'Retirer mon appui' : 'J’appuie cette idée') + ' · ' + n + ' appuis',
          voteBg: on ? '#14201B' : '#FFFFFF',
          voteFg: on ? '#FFFFFF' : '#14201B',
          vote: () => {
            const next = Object.assign({}, voted);
            next[i.id] = !on;
            this.setState({ voted: next });
          }
        };
      })
    };
  }
}
</script>
</body>
</html>
