<div style="min-width: 0">
<div style="font-size: 10px; font-weight: 700; letter-spacing: 0.08em; color: #FF5B1A">J’AI COURU LE DEMI-MARATHON</div>

</div>
<div style="font-size: 10px; line-height: 1.3; text-align: right; color: #C9D2CC">23 mai 2027<br>Présenté par Bourret</div>

</figure>
</div>

<div role="group" aria-label="Cadre" style="flex: none; display: flex; gap: 6px">
<sc-for list="{{styles}}" as="c" hint-placeholder-count="2">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="flex: 1; height: 40px; border-radius: 999px; border: 2px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>

<section aria-label="Texte suggéré" style="flex: none; background: #FFFFFF; border-radius: 14px; padding: 10px 12px; display: flex; align-items: center; gap: 10px">
<div style="flex-grow: 1; min-width: 0">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #4A5650">TEXTE SUGGÉRÉ</div>
<div style="font-size: 14px; line-height: 1.35">{{caption}}</div>
</div>
<button type="button" onClick="{{copy}}" style="height: 40px; flex: none; padding: 0 12px; border: 2px solid #14201B; border-radius: 10px; background: #FFFFFF; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">{{copyLabel}}</button>

<div role="group" aria-label="Partager sur" style="flex: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{networks}}" as="n" hint-placeholder-count="4">
<button type="button" onClick="{{n.pick}}" style="height: 44px; border: 0; border-radius: 12px; background: {{n.bg}}; color: {{n.fg}}; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer">{{n.label}}</button>

<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const story = st.format === 'story';
    const withTime = st.withTime !== false;
    const shared = st.shared || '';
    const NETWORKS = [
      { label: 'Instagram', bg: '#14201B', fg: '#FFFFFF' },
      { label: 'Facebook', bg: '#14201B', fg: '#FFFFFF' },
      { label: 'TikTok', bg: '#14201B', fg: '#FFFFFF' },
      { label: 'Enregistrer', bg: '#FF5B1A', fg: '#14201B' }
    ];
    const STYLES = [
      { label: 'Logo seulement', time: false },
      { label: 'Logo et mon temps', time: true }
    ];
    return {
      pubPressed: story ? 'false' : 'true',
      storyPressed: story ? 'true' : 'false',
      pubBg: story ? 'transparent' : '#FFFFFF',
      storyBg: story ? '#FFFFFF' : 'transparent',
      setPub: () => this.setState({ format: 'pub', shared: '' }),
      setStory: () => this.setState({ format: 'story', shared: '' }),
      pw: story ? 168 : 280,
      ph: story ? 298 : 280,
      lw: story ? 62 : 72,
      timeSize: story ? 24 : 28,
      withTime: withTime,
      styles: STYLES.map((c) => {
        const on = c.time === withTime;
        return {
          label: c.label,
          pressed: on ? 'true' : 'false',
          bg: on ? '#14201B' : '#FFFFFF',
          fg: on ? '#FFFFFF' : '#14201B',
          border: on ? '#14201B' : '#D9DDD5',
          pick: () => this.setState({ withTime: c.time, shared: '' })
        };
      }),
      caption: 'J’ai couru le demi-marathon de la Course Des-Chênes-Toi! Bourret en 2:04:31.',
      copyLabel: st.copied ? 'Copié!' : 'Copier',
      copy: () => this.setState({ copied: true }),
      networks: NETWORKS.map((n) => ({ label: n.label, bg: n.bg, fg: n.fg, pick: () => this.setState({ shared: n.label }) })),
      hasShared: !!shared,
      sharedText: shared === 'Enregistrer'
        ? 'Image enregistrée dans ta galerie, avec le logo de la course.'
        : 'Image prête avec le logo. ' + shared + ' s’ouvre pour la publier' + (story ? ' en story.' : '.')
    };
  }
}
</script>
