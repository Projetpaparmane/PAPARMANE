<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const pts = [[120,430],[132,380],[150,330],[178,282],[212,236],[250,196],[296,160],[350,132],[410,112],[470,100],[530,98],[590,108],[650,116],[710,122],[770,140],[822,170],[858,210],[872,252],[860,296],[828,334],[784,362],[730,380],[670,392],[600,404],[530,420],[460,438],[390,452],[320,458],[250,452],[196,440]];
    const seg = [];
    let total = 0;
    for (let i = 1; i < pts.length; i++) {
      const dx = pts[i][0] - pts[i - 1][0];
      const dy = pts[i][1] - pts[i - 1][1];
      const len = Math.sqrt(dx * dx + dy * dy);
      seg.push({ a: pts[i - 1], dx: dx, dy: dy, len: len, start: total });
      total += len;
    }
    const at = (t) => {
      const d = Math.max(0, Math.min(0.9999, t)) * total;
      const s = seg.find((g) => d >= g.start && d < g.start + g.len) || seg[seg.length - 1];
      const k = (d - s.start) / s.len;
      return { x: s.a[0] + s.dx * k, y: s.a[1] + s.dy * k, nx: -s.dy / s.len, ny: s.dx / s.len };
    };
    const pos = (p, off) => ({
      left: ((p.x + p.nx * off) / 10).toFixed(2) + '%',
      top: ((p.y + p.ny * off) / 5).toFixed(2) + '%'
    });
    let seed = 1247;
    const rnd = () => {
      seed = (seed * 16807) % 2147483647;
      return seed / 2147483647;
    };
    const runners = [];
    for (let i = 0; i < 80; i++) {
      const t = 0.08 + 0.84 * ((rnd() + rnd() + rnd()) / 3);
      runners.push(pos(at(t), (rnd() - 0.5) * 12));
    }
    const ravito = { label: 'R', bg: '#FFFFFF', fg: '#14201B', border: '#14201B' };
    const secours = { label: '+', bg: '#C81E1E', fg: '#FFFFFF', border: '#FFFFFF' };
    const poiList = [
      { t: 0.22, kind: ravito, name: 'Ravito 1, km 5,5' },
      { t: 0.5, kind: ravito, name: 'Ravito 2, km 12,5' },
      { t: 0.76, kind: ravito, name: 'Ravito 3, km 19' },
      { t: 0.4, kind: secours, name: 'Secours 1, km 10' },
      { t: 0.8, kind: secours, name: 'Secours 2, km 20' }
    ];
    const pois = poiList.map((p) => {
      const xy = pos(at(p.t), -22);
      return { left: xy.left, top: xy.top, label: p.kind.label, bg: p.kind.bg, fg: p.kind.fg, border: p.kind.border, name: p.name };
    });
    return {
      route: pts.map((p) => p.join(',')).join(' '),
      runners: runners,
      pois: pois,
      start: pos(at(0), 0),
      still: pos(at(0.364), 0),
      sos: pos(at(0.692), 0)
    };
  }
}
</script>
