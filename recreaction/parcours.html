<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Parcours interactif · Récréaction</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#14201B}a:hover{color:#000000}
</style>
<link rel="stylesheet" href="prototype.css">
<script src="runtime.js" defer></script>
</head>
<body>
<a class="proto-home" href="index.html">Tous les écrans</a>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #EEF0EA; color: #14201B; font-family: 'Barlow', sans-serif; display: flex; flex-direction: column; overflow: hidden">

<header style="flex: none; padding: 20px 16px 6px">
<h1 style="margin: 0; font-size: 22px; font-weight: 700; line-height: 1.15">Parcours</h1>
<div style="font-size: 14px; color: #4A5650">Des-Chênes-Toi! · ta course : demi-marathon</div>
</header>

<main style="flex: 1; min-height: 0; overflow: hidden; padding: 4px 16px 10px; display: flex; flex-direction: column; gap: 8px">

<div role="group" aria-label="Affichage de la carte" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #DDE1D8; border-radius: 14px">
<span aria-current="page" style="height: 38px; border-radius: 10px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; box-shadow: 0 1px 2px rgba(20, 32, 27, 0.15)">Parcours</span>
<a href="plan-du-site.html" style="height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; color: #3F4A44; text-decoration: none">Plan du site</a>
</div>

<div role="group" aria-label="Distance" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px">
<sc-for list="{{races}}" as="r" hint-placeholder-count="4">
<button type="button" onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="height: 48px; border-radius: 12px; border: 2px solid {{r.border}}; background: {{r.bg}}; color: {{r.fg}}; font-family: 'Barlow', sans-serif; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; padding: 0">
<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 16px; white-space: nowrap; font-weight: 700">{{r.label}}</span>
<span style="font-size: 12px; font-weight: 600">{{r.dplus}}</span>
</button>
</sc-for>
</div>

<section aria-label="Carte du parcours" style="background: #FFFFFF; border-radius: 18px; padding: 10px; display: flex; flex-direction: column; gap: 6px">
<div style="position: relative; width: 338px; height: 214px; border-radius: 12px; overflow: hidden; background: #EEF0EA">
<img src="carte-drummondville.svg" alt="" style="position: absolute; left: {{img.l}}px; top: {{img.t}}px; width: {{img.w}}px; height: {{img.h}}px; max-width: none; opacity: 0.85">
<svg viewBox="{{vb}}" preserveAspectRatio="none" role="img" aria-label="{{mapLabel}}" style="position: absolute; left: 0; top: 0; width: 338px; height: 214px">
<path d="{{routeD}}" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
<path d="{{routeD}}" fill="none" stroke="#14201B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
<path d="{{doneD}}" fill="none" stroke="#FF5B1A" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>
</svg>
<sc-for list="{{labels}}" as="l" hint-placeholder-count="4">
<span style="position: absolute; left: {{l.x}}px; top: {{l.y}}px; transform: translate(-50%, -50%) rotate({{l.r}}deg); font-size: {{l.size}}px; font-weight: 600; font-style: {{l.style}}; letter-spacing: {{l.ls}}; color: {{l.color}}; white-space: nowrap; pointer-events: none; text-shadow: 0 0 2px #F3F4F0, 0 0 2px #F3F4F0, 0 0 4px #F3F4F0">{{l.t}}</span>
</sc-for>
<span aria-hidden="true" style="position: absolute; left: {{startLeft}}px; top: {{startTop}}px; width: 20px; height: 20px; border-radius: 999px; background: #14201B; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 21V4M6 4h11l-2.5 4L17 12H6"></path></svg></span>
<sc-for list="{{kms}}" as="k" hint-placeholder-count="4">
<span style="position: absolute; left: {{k.left}}px; top: {{k.top}}px; min-width: 22px; height: 18px; box-sizing: border-box; padding: 0 4px; border-radius: 999px; background: #FFFFFF; border: 1.5px solid #8A958F; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #3F4A44">{{k.label}}</span>
</sc-for>
<sc-for list="{{marks}}" as="m" hint-placeholder-count="5">
<span style="position: absolute; left: {{m.left}}px; top: {{m.top}}px; width: 20px; height: 20px">
<sc-if value="{{m.isRavito}}" hint-placeholder-val="{{true}}">
<span style="width: 20px; height: 20px; box-sizing: border-box; border-radius: 999px; background: #FFFFFF; border: 2.5px solid #14201B; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">R</span>
</sc-if>
<sc-if value="{{m.isSecours}}" hint-placeholder-val="{{false}}">
<span style="width: 20px; height: 20px; border-radius: 5px; background: #C81E1E; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 1v10M1 6h10" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"></path></svg></span>
</sc-if>
<sc-if value="{{m.isMusique}}" hint-placeholder-val="{{false}}">
<span style="width: 20px; height: 20px; border-radius: 999px; background: #5B3BB5; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v11.3A3.5 3.5 0 1 0 12 18V8h6V3z" fill="#FFFFFF"></path></svg></span>
</sc-if>
<sc-if value="{{m.isPhoto}}" hint-placeholder-val="{{false}}">
<span style="width: 20px; height: 20px; border-radius: 999px; background: #3F6273; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3"></circle></svg></span>
</sc-if>
</span>
</sc-for>
<span aria-hidden="true" style="position: absolute; left: {{cur.left}}px; top: {{cur.top}}px; width: 18px; height: 18px; box-sizing: border-box; border-radius: 999px; background: #FF5B1A; border: 3px solid #FFFFFF; box-shadow: 0 0 0 6px rgba(255, 91, 26, 0.3)"></span>
<button type="button" onClick="{{toggleZoom}}" aria-label="{{zoomLabel}}" style="position: absolute; right: 6px; top: 6px; width: 40px; height: 40px; border: 0; border-radius: 10px; background: #FFFFFF; color: #14201B; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 1px 4px rgba(20, 32, 27, 0.3)">
<sc-if value="{{zoomIn}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5M11 8v6M8 11h6"></path></svg></sc-if>
<sc-if value="{{zoomOut}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-4.5-4.5M8 11h6"></path></svg></sc-if>
</button>
<span style="position: absolute; right: 4px; bottom: 3px; padding: 1px 5px; border-radius: 4px; background: rgba(255, 255, 255, 0.8); font-size: 10px; color: #4A5650">© OpenStreetMap · tracés officiels 2026</span>
</div>
<ul style="list-style: none; margin: 0; padding: 0 2px; display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12px; font-weight: 600; color: #4A5650">
<li style="display: flex; align-items: center; gap: 5px"><span style="width: 12px; height: 12px; box-sizing: border-box; border-radius: 999px; border: 2px solid #14201B; background: #FFFFFF"></span>Ravito</li>
<li style="display: flex; align-items: center; gap: 5px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #C81E1E"></span>Secours</li>
<li style="display: flex; align-items: center; gap: 5px"><span style="width: 12px; height: 12px; border-radius: 999px; background: #5B3BB5"></span>Musique</li>
<li style="display: flex; align-items: center; gap: 5px"><span style="width: 12px; height: 12px; border-radius: 999px; background: #3F6273"></span>Photo</li>
<li style="display: flex; align-items: center; gap: 5px"><span style="width: 12px; height: 12px; border-radius: 999px; background: #FF5B1A"></span>Repère</li>
</ul>
</section>

<section aria-label="Profil du parcours" style="background: #FFFFFF; border-radius: 18px; padding: 10px 10px 10px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px">
<div style="flex-grow: 1; min-width: 0">
<div style="display: flex; align-items: baseline; gap: 8px">
<span style="font-family: 'Barlow Condensed', sans-serif; font-size: 30px; font-weight: 700; line-height: 1">Km {{kmLabel}}</span>
<span style="font-size: 14px; font-weight: 700; color: #A33A00">{{hereName}}</span>
</div>
<div style="font-size: 13px; color: #4A5650">{{altLabel}}</div>
</div>
<button type="button" onClick="{{prev}}" aria-label="Reculer sur le parcours" style="width: 44px; height: 44px; flex: none; border: 2px solid #D9DDD5; border-radius: 12px; background: #FFFFFF; color: #14201B; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<button type="button" onClick="{{next}}" aria-label="Avancer sur le parcours" style="width: 44px; height: 44px; flex: none; border: 2px solid #D9DDD5; border-radius: 12px; background: #FFFFFF; color: #14201B; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
<div style="position: relative; width: 338px; height: 72px">
<svg viewBox="0 0 338 72" width="338" height="72" aria-hidden="true" style="display: block">
<path d="{{profArea}}" fill="#FFE6D2"></path>
<path d="{{profLine}}" fill="none" stroke="#A33A00" stroke-width="2" stroke-linejoin="round"></path>
</svg>
<sc-for list="{{profMarks}}" as="p" hint-placeholder-count="4">
<span style="position: absolute; left: {{p.left}}px; top: 0; width: 2px; height: 72px; background: {{p.color}}; opacity: 0.55"></span>
</sc-for>
<span style="position: absolute; left: {{cursorX}}px; top: 0; width: 2px; height: 72px; background: #FF5B1A"></span>
<span style="position: absolute; left: {{cursorDotX}}px; top: {{cursorDotY}}px; width: 12px; height: 12px; box-sizing: border-box; border-radius: 999px; background: #FF5B1A; border: 2px solid #FFFFFF"></span>
<div style="position: absolute; inset: 0; display: flex">
<sc-for list="{{zones}}" as="z" hint-placeholder-count="12">
<button type="button" onClick="{{z.go}}" aria-label="{{z.label}}" style="flex: 1; min-width: 0; height: 72px; border: 0; padding: 0; background: transparent; cursor: pointer"></button>
</sc-for>
</div>
</div>
<div style="display: flex; justify-content: space-between; font-size: 11px; font-weight: 600; color: #4A5650"><span>0 km</span><span>Touche le profil pour t’y rendre</span><span>{{distLabel}}</span></div>
<div style="display: flex; align-items: center; gap: 10px; padding-top: 6px; border-top: 1px solid #E4E8E0">
<div style="flex-grow: 1; min-width: 0">
<div style="font-size: 12px; font-weight: 700; letter-spacing: 0.06em; color: #4A5650">PROCHAIN · DANS {{toNext}}</div>
<div style="font-size: 15px; font-weight: 700">{{nextName}} · km {{nextKm}}</div>
<div style="font-size: 13px; color: #4A5650">{{nextDetail}}</div>
</div>
<button type="button" onClick="{{goNext}}" style="height: 44px; flex: none; padding: 0 14px; border: 0; border-radius: 12px; background: #14201B; color: #FFFFFF; font-family: 'Barlow', sans-serif; font-size: 14px; font-weight: 700; cursor: pointer">{{goNextLabel}}</button>
</div>
</section>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<button type="button" style="height: 48px; border: 2px solid #14201B; border-radius: 14px; background: transparent; color: #14201B; font-family: 'Barlow', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="3"></rect><path d="M9 6l1-3h4l1 3M9 18l1 3h4l1-3M12 9v3l2 1"></path></svg>Vers ma montre</button>
<a href="jour-j.html" style="height: 48px; border-radius: 14px; background: #FF5B1A; color: #14201B; font-size: 15px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Mode course</a>
</div>

</main>

<nav aria-label="Navigation principale" style="flex: none; height: 80px; box-sizing: border-box; padding: 6px 6px 20px; background: #FFFFFF; border-top: 1px solid #D9DDD5; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr))">
<a href="accueil.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5C6862; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 28px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"></path><path d="M5 10v10h14V10"></path></svg></span><span>Accueil</span></a>
<a href="parcours.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #14201B; font-size: 11px; font-weight: 700"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 28px; border-radius: 999px; background: #FF5B1A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2"></circle><circle cx="18" cy="6" r="2"></circle><path d="M8 18h6a3 3 0 0 0 0-6h-4a3 3 0 0 1 0-6h6"></path></svg></span><span>Parcours</span></a>
<a href="dossard.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5C6862; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 28px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"></rect><path d="M8 10h8"></path><path d="M8 14h5"></path></svg></span><span>Dossard</span></a>
<a href="photos.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5C6862; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 28px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span><span>Photos</span></a>
<a href="avantages.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-decoration: none; color: #5C6862; font-size: 11px; font-weight: 600"><span style="display: flex; align-items: center; justify-content: center; width: 52px; height: 28px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12V4h8l10 10-8 8z"></path><circle cx="7.5" cy="8.5" r="1.5"></circle></svg></span><span>Avantages</span></a>
</nav>

</div>
</template>

      if (k <= P[0][2]) return { x: P[0][0], y: P[0][1] };
      let lo = 0, hi = P.length - 1;
      if (k >= P[hi][2]) return { x: P[hi][0], y: P[hi][1] };
      while (hi - lo > 1) { const m = (lo + hi) >> 1; if (P[m][2] < k) lo = m; else hi = m; }
      const a = P[lo], b = P[hi];
      const t = (k - a[2]) / ((b[2] - a[2]) || 1);
      return { x: a[0] + (b[0] - a[0]) * t, y: a[1] + (b[1] - a[1]) * t };
    };

    // Cadrage : tout le parcours, ou zoom autour du repère
    const VW = 338, VH = 214, asp = VW / VH;
    let cw, ch, cx0, cy0;
    if (zoom) {
      cw = 620; ch = cw / asp;
      const c = at(km);
      cx0 = c.x - cw / 2; cy0 = c.y - ch / 2;
    } else {
      const b = race.bbox, pad = 60;
      cw = b[2] - b[0] + pad * 2; ch = b[3] - b[1] + pad * 2;
      if (cw / ch > asp) ch = cw / asp; else cw = ch * asp;
      cx0 = (b[0] + b[2]) / 2 - cw / 2; cy0 = (b[1] + b[3]) / 2 - ch / 2;
    }
    cx0 = Math.max(0, Math.min(DATA.map.w - cw, cx0));
    cy0 = Math.max(0, Math.min(DATA.map.h - ch, cy0));
    const s = VW / cw;
    const px = (x) => (x - cx0) * s;
    const py = (y) => (y - cy0) * s;
    const routeD = 'M' + P.map((p) => p[0] + ' ' + p[1]).join(' L');
    const cur = at(km);
    const done = P.filter((p) => p[2] < km).map((p) => p[0] + ' ' + p[1]);
    const doneD = 'M' + done.concat([cur.x.toFixed(1) + ' ' + cur.y.toFixed(1)]).join(' L');

    // Noms de rues, de quartiers et de la rivière, lisibles quel que soit le cadrage
    const placed = [], names = {}, labels = [];
    DATA.labels
      .filter((l) => zoom || l.w || l.q || l.p <= 1)
      .slice()
      .sort((a, b) => (a.w ? -2 : a.q ? -1 : a.p) - (b.w ? -2 : b.q ? -1 : b.p))
      .forEach((l) => {
        const x = px(l.x), y = py(l.y);
        if (x < 34 || x > VW - 34 || y < 14 || y > VH - 22) return;
        if (names[l.t] || labels.length >= (zoom ? 8 : 6)) return;
        if (placed.some((q) => Math.abs(q[0] - x) < 80 && Math.abs(q[1] - y) < 24)) return;
        placed.push([x, y]);
        names[l.t] = true;
        let r = l.r;
        if (r > 90) r -= 180;
        if (r < -90) r += 180;
        labels.push({
          t: l.q ? l.t.toUpperCase() : l.t, x: x.toFixed(1), y: y.toFixed(1), r: r,
          size: l.w ? 11 : 10, style: l.w ? 'italic' : 'normal', color: l.w ? '#3F6E89' : '#56615B', ls: l.q ? '0.08em' : '0'
        });
      });

    const kmEvery = D <= 5 ? 1 : (D <= 10 ? 2 : (D <= 25 ? 5 : 10));
    const kms = [];
    for (let k = kmEvery; k < D - 0.4; k += kmEvery) {
      const p = at(k);
      const x = px(p.x), y = py(p.y);
      if (x > 0 && x < VW && y > 0 && y < VH) kms.push({ label: String(k), left: (x - 11).toFixed(1), top: (y - 9).toFixed(1) });
    }
    const marks = race.poi.filter((p) => p.m).map((p) => {
      const q = at(p.km);
      return { left: (px(q.x) - 10).toFixed(1), top: (py(q.y) - 10).toFixed(1), isRavito: p.k === 'ravito', isSecours: p.k === 'secours', isMusique: p.k === 'musique', isPhoto: p.k === 'photo' };
    }).filter((m) => m.left > -20 && m.left < VW && m.top > -20 && m.top < VH);

    // Profil d'altitude réel
    const A = race.alt;
    const altAt = (k) => {
      if (k <= A[0][0]) return A[0][1];
      for (let i = 1; i < A.length; i++) {
        if (k <= A[i][0]) return A[i - 1][1] + (A[i][1] - A[i - 1][1]) * (k - A[i - 1][0]) / ((A[i][0] - A[i - 1][0]) || 1);
      }
      return A[A.length - 1][1];
    };
    const alts = A.map((a) => a[1]);
    let lo = Math.min.apply(null, alts) - 4, hi = Math.max.apply(null, alts) + 4;
    if (hi - lo < 30) { const mid = (hi + lo) / 2; lo = mid - 15; hi = mid + 15; }
    const PW = 338, PH = 72;
    const yv = (a) => PH - 4 - (a - lo) / (hi - lo) * (PH - 14);
    const samples = [];
    for (let i = 0; i <= 84; i++) samples.push((PW * i / 84).toFixed(1) + ' ' + yv(altAt(D * i / 84)).toFixed(1));
    const profLine = 'M' + samples.join(' L');
    const slope = Math.round((altAt(Math.min(D, km + 0.25)) - altAt(Math.max(0, km - 0.25))) / 5);
    const slopeLabel = slope === 0 ? 'plat' : 'pente ' + (slope > 0 ? '+' : '−') + Math.abs(slope) + ' %';

    const here = race.poi.find((p) => Math.abs(p.km - km) < 0.05);
    const nextPt = race.poi.filter((p) => p.km > km + 0.05)[0] ||
      (km < D - 0.05 ? { km: D, n: 'Arrivée', d: 'École Marie-Rivier · ta médaille t’attend' } : null);
    const set = (k) => this.setState({ race: race.id, km: Math.round(Math.max(0, Math.min(D, k)) * 10) / 10 });
    const zoneCount = D <= 10 ? 10 : 21;
    const zones = [];
    for (let i = 0; i < zoneCount; i++) {
      const k = Math.round((D * (i + 0.5) / zoneCount) * 10) / 10;
      zones.push({ label: 'Aller au km ' + fmt(k), go: () => set(k) });
    }
    const st0 = DATA.map.start;

    return {
      races: RACES.map((r) => {
        const on = r.id === race.id;
        return {
          label: r.label, dplus: r.sub, pressed: on ? 'true' : 'false',
          bg: on ? '#14201B' : '#FFFFFF', fg: on ? '#FFFFFF' : '#14201B', border: on ? '#14201B' : '#FFFFFF',
          pick: () => this.setState({ race: r.id, km: r.start })
        };
      }),
      mapLabel: 'Carte de Drummondville avec le parcours ' + race.name.toLowerCase() + ', ' + race.poi.filter((p) => p.k === 'ravito').length + ' ravitos. Repère au km ' + fmt(km) + '.',
      img: { l: (-cx0 * s).toFixed(1), t: (-cy0 * s).toFixed(1), w: (DATA.map.w * s).toFixed(1), h: (DATA.map.h * s).toFixed(1) },
      vb: cx0.toFixed(1) + ' ' + cy0.toFixed(1) + ' ' + cw.toFixed(1) + ' ' + ch.toFixed(1),
      routeD: routeD,
      doneD: doneD,
      labels: labels,
      kms: kms,
      marks: marks,
      startLeft: (px(st0[0]) - 10).toFixed(1),
      startTop: (py(st0[1]) - 10).toFixed(1),
      cur: { left: (px(cur.x) - 9).toFixed(1), top: (py(cur.y) - 9).toFixed(1) },
      zoomLabel: zoom ? 'Voir tout le parcours' : 'Zoomer sur le repère',
      zoomIn: !zoom,
      zoomOut: zoom,
      toggleZoom: () => this.setState({ zoom: !zoom }),
      kmLabel: fmt(km),
      hereName: here ? here.n : (km === 0 ? 'Départ' : (km >= D ? 'Arrivée' : '')),
      altLabel: Math.round(altAt(km)) + ' m d’altitude · ' + slopeLabel,
      profLine: profLine,
      profArea: profLine + ' L' + PW + ' ' + PH + ' L0 ' + PH + ' Z',
      profMarks: race.poi.filter((p) => p.k === 'ravito' || p.k === 'secours').map((p) => ({
        left: (p.km / D * PW - 1).toFixed(1), color: p.k === 'ravito' ? '#14201B' : '#C81E1E'
      })),
      cursorX: (km / D * PW - 1).toFixed(1),
      cursorDotX: (km / D * PW - 6).toFixed(1),
      cursorDotY: (yv(altAt(km)) - 6).toFixed(1),
      zones: zones,
      distLabel: fmt(D) + ' km',
      toNext: nextPt ? fmt(nextPt.km - km) + ' KM' : '—',
      nextName: nextPt ? nextPt.n : 'Tu es à l’arrivée',
      nextKm: nextPt ? fmt(nextPt.km) : fmt(D),
      nextDetail: nextPt ? nextPt.d : 'Bravo! Reviens au départ pour explorer encore.',
      goNextLabel: nextPt ? 'Y aller' : 'Au départ',
      goNext: () => set(nextPt ? nextPt.km : 0),
      prev: () => set(km - race.step),
      next: () => set(km + race.step)
    };
  }
}
</script>
