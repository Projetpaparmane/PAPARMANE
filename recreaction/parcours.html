</div>

<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const RACES = [
      {
        id: 'renald', dist: 2, label: 'M. Renald', sub: '1 et 2 km', step: 0.5, start: 0.5,
        route: [[60,150],[84,152],[98,138],[90,122],[68,122],[54,134]],
        alt: [[0,92],[0.5,94],[1,95],[1.5,93],[2,92]],
        pts: [
          { km: 0.5, kind: 'fans', name: 'Demi-tour du 1 km', detail: 'Les jeunes du 1 km reviennent vers l’arrivée' },
          { km: 1.5, kind: 'fans', name: 'Zone des parents', detail: 'Encouragez-les tout près de l’arrivée' }
        ]
      },
      {
        id: '5', dist: 5, label: '5 km', sub: '10 h 15', step: 0.5, start: 2.5,
        route: [[60,150],[100,150],[120,128],[110,104],[78,104],[56,124]],
        alt: [[0,92],[1,95],[2,99],[2.5,97],[3.5,93],[4.2,90],[5,92]],
        pts: [
          { km: 1.5, kind: 'fans', name: 'Zone d’encouragement', detail: 'Musique et spectateurs · 5 min à pied du départ' },
          { km: 2.5, kind: 'ravito', name: 'Point d’eau', detail: 'Eau' }
        ]
      },
      {
        id: '10', dist: 10, label: '10 km', sub: '9 h 45', step: 1, start: 5,
        route: [[60,150],[110,152],[150,140],[176,112],[160,86],[120,84],[86,96],[62,118]],
        alt: [[0,92],[2,96],[3,101],[4.5,94],[6,88],[7.5,96],[9,99],[10,92]],
        pts: [
          { km: 3, kind: 'ravito', name: 'Ravito 1', detail: 'Eau et électrolytes' },
          { km: 5, kind: 'fans', name: 'Zone d’encouragement', detail: 'Musique et spectateurs' },
          { km: 6.5, kind: 'ravito', name: 'Ravito 2', detail: 'Eau, électrolytes et fruits' },
          { km: 8, kind: 'secours', name: 'Poste de secours', detail: 'Secouristes et défibrillateur' }
        ]
      },
      {
        id: '21', dist: 21.1, label: 'Demi', sub: '21,1 km', step: 1, start: 10.5,
        route: [[60,150],[110,154],[160,150],[206,138],[246,118],[268,96],[250,78],[214,86],[178,100],[140,96],[104,92],[74,108],[58,128]],
        alt: [[0,92],[3,98],[5,104],[7,95],[9,86],[10.5,84],[12,90],[14,101],[16,107],[18,98],[20,93],[21.1,92]],
        pts: [
          { km: 5, kind: 'ravito', name: 'Ravito 1', detail: 'Eau et électrolytes' },
          { km: 8, kind: 'secours', name: 'Poste de secours', detail: 'Secouristes et défibrillateur' },
          { km: 10.5, kind: 'ravito', name: 'Ravito 2', detail: 'Eau, électrolytes et fruits · mi-parcours' },
          { km: 13, kind: 'fans', name: 'Zone d’encouragement', detail: 'Musique et spectateurs · facile d’accès en voiture' },
          { km: 16, kind: 'ravito', name: 'Ravito 3', detail: 'Eau et fruits' },
          { km: 18, kind: 'secours', name: 'Poste de secours', detail: 'Secouristes et défibrillateur' }
        ]
      },
      {
        id: '42', dist: 42.2, label: 'Marathon', sub: '42,2 km', step: 2, start: 21,
        route: [[60,150],[110,160],[170,166],[232,160],[286,146],[318,120],[322,92],[300,74],[262,40],[220,30],[176,40],[150,62],[120,96],[90,110],[66,128]],
        alt: [[0,92],[5,104],[9,88],[12,84],[16,99],[20,110],[24,96],[28,86],[32,94],[36,108],[39,99],[42.2,92]],
        pts: [
          { km: 5, kind: 'ravito', name: 'Ravito 1', detail: 'Eau et électrolytes' },
          { km: 10, kind: 'ravito', name: 'Ravito 2', detail: 'Eau et électrolytes' },
          { km: 12, kind: 'secours', name: 'Poste de secours', detail: 'Secouristes et défibrillateur' },
          { km: 15, kind: 'ravito', name: 'Ravito 3', detail: 'Eau, électrolytes et fruits' },
          { km: 21, kind: 'fans', name: 'Mi-parcours', detail: 'Zone d’encouragement · musique et spectateurs' },
          { km: 25, kind: 'ravito', name: 'Ravito 4', detail: 'Eau, électrolytes et fruits' },
          { km: 30, kind: 'ravito', name: 'Ravito 5', detail: 'Eau, gels et fruits' },
          { km: 32, kind: 'secours', name: 'Poste de secours', detail: 'Secouristes et défibrillateur' },
          { km: 35, kind: 'ravito', name: 'Ravito 6', detail: 'Eau et fruits' },
          { km: 40, kind: 'ravito', name: 'Ravito 7', detail: 'Eau · dernier ravito' }
        ]
      }
    ];
    const race = RACES.find((r) => r.id === (st.race || '21')) || RACES[3];
    const D = race.dist;
    const km = st.km == null ? race.start : Math.max(0, Math.min(D, st.km));
    const fmt = (n) => String(Math.round(n * 10) / 10).replace('.', ',');

    // Tracé lissé (Catmull-Rom) puis ré-échantillonné : la position suit exactement la ligne.
    const P = race.route;
    const n = P.length;
    const dense = [];
    for (let i = 0; i < n; i++) {
      const p0 = P[(i - 1 + n) % n], p1 = P[i], p2 = P[(i + 1) % n], p3 = P[(i + 2) % n];
      for (let s = 0; s < 8; s++) {
        const t = s / 8, t2 = t * t, t3 = t2 * t;
        const f = (a, b, c, d) => 0.5 * (2 * b + (-a + c) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (-a + 3 * b - 3 * c + d) * t3);
        dense.push([f(p0[0], p1[0], p2[0], p3[0]), f(p0[1], p1[1], p2[1], p3[1])]);
      }
    }
    dense.push(P[0]);
    const seg = [];
    let L = 0;
    for (let i = 1; i < dense.length; i++) {
      const d = Math.hypot(dense[i][0] - dense[i - 1][0], dense[i][1] - dense[i - 1][1]);
      seg.push(d);
      L += d;
    }
    const at = (k) => {
      let t = Math.max(0, Math.min(1, k / D)) * L;
      for (let i = 0; i < seg.length; i++) {
        if (t <= seg[i] || i === seg.length - 1) {
          const f = seg[i] ? Math.min(1, t / seg[i]) : 0;
          return { x: dense[i][0] + (dense[i + 1][0] - dense[i][0]) * f, y: dense[i][1] + (dense[i + 1][1] - dense[i][1]) * f };
        }
        t -= seg[i];
      }
      return { x: P[0][0], y: P[0][1] };
    };
    const routeD = 'M' + dense.map((p) => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');

    const A = race.alt;
    const altAt = (k) => {
      if (k <= A[0][0]) return A[0][1];
      for (let i = 1; i < A.length; i++) {
        if (k <= A[i][0]) return A[i - 1][1] + (A[i][1] - A[i - 1][1]) * (k - A[i - 1][0]) / (A[i][0] - A[i - 1][0]);
      }
      return A[A.length - 1][1];
    };
    const alts = A.map((a) => a[1]);
    const lo = Math.min.apply(null, alts) - 12;
    const hi = Math.max.apply(null, alts) + 12;
    const PW = 338, PH = 72;
    const py = (a) => PH - 4 - (a - lo) / (hi - lo) * (PH - 14);
    const samples = [];
    for (let i = 0; i <= 84; i++) {
      const k = D * i / 84;
      samples.push((PW * i / 84).toFixed(1) + ' ' + py(altAt(k)).toFixed(1));
    }
    const profLine = 'M' + samples.join(' L');
    const profArea = profLine + ' L' + PW + ' ' + PH + ' L0 ' + PH + ' Z';

    const slope = Math.round((altAt(Math.min(D, km + 0.25)) - altAt(Math.max(0, km - 0.25))) / 5);
    const slopeLabel = slope === 0 ? 'plat' : 'pente ' + (slope > 0 ? '+' : '−') + Math.abs(slope) + ' %';
    const here = race.pts.find((p) => Math.abs(p.km - km) < 0.05);
    const nextPt = race.pts.filter((p) => p.km > km + 0.05).sort((a, b) => a.km - b.km)[0] ||
      (km < D - 0.05 ? { km: D, name: 'Arrivée', detail: 'Fin du parcours · ta médaille t’attend' } : null);
    const cur = at(km);
    const set = (k) => this.setState({ race: race.id, km: Math.round(Math.max(0, Math.min(D, k)) * 10) / 10 });

    const kmEvery = D <= 5 ? 1 : (D <= 10 ? 2 : (D <= 25 ? 5 : 10));
    const kms = [];
    for (let k = kmEvery; k < D - 0.5; k += kmEvery) {
      const p = at(k);
      kms.push({ label: String(k), left: (p.x - 11).toFixed(1), top: (p.y - 9).toFixed(1) });
    }
    const zoneCount = D <= 10 ? 10 : 21;
    const zones = [];
    for (let i = 0; i < zoneCount; i++) {
      const k = Math.round((D * (i + 0.5) / zoneCount) * 10) / 10;
      zones.push({ label: 'Aller au km ' + fmt(k), go: () => set(k) });
    }

    return {
      races: RACES.map((r) => {
        const on = r.id === race.id;
        return {
          label: r.label,
          dplus: r.sub,
          pressed: on ? 'true' : 'false',
          bg: on ? '#14201B' : '#FFFFFF',
          fg: on ? '#FFFFFF' : '#14201B',
          border: on ? '#14201B' : '#FFFFFF',
          pick: () => this.setState({ race: r.id, km: r.start })
        };
      }),
      mapLabel: 'Parcours de ' + fmt(D) + ' km, ' + race.pts.filter((p) => p.name.indexOf('Ravito') === 0).length + ' ravitos. Repère au km ' + fmt(km) + '.',
      routeD: routeD,
      kms: kms,
      marks: race.pts.map((p) => {
        const q = at(p.km);
        return {
          left: (q.x - 10).toFixed(1),
          top: (q.y - 10).toFixed(1),
          isRavito: p.kind === 'ravito',
          isSecours: p.kind === 'secours',
          isBarriere: p.kind === 'barriere',
          isFans: p.kind === 'fans'
        };
      }),
      cur: { left: (cur.x - 9).toFixed(1), top: (cur.y - 9).toFixed(1) },
      kmLabel: fmt(km),
      hereName: here ? here.name : (km === 0 ? 'Départ' : (km >= D ? 'Arrivée' : '')),
      altLabel: Math.round(altAt(km)) + ' m d’altitude · ' + slopeLabel,
      profLine: profLine,
      profArea: profArea,
      profMarks: race.pts.filter((p) => p.kind !== 'fans').map((p) => ({
        left: (p.km / D * PW - 1).toFixed(1),
        color: p.kind === 'ravito' ? '#14201B' : (p.kind === 'secours' ? '#C81E1E' : '#14201B')
      })),
      cursorX: (km / D * PW - 1).toFixed(1),
      cursorDotX: (km / D * PW - 6).toFixed(1),
      cursorDotY: (py(altAt(km)) - 6).toFixed(1),
      zones: zones,
      distLabel: fmt(D) + ' km',
      toNext: nextPt ? fmt(nextPt.km - km) + ' KM' : '—',
      nextName: nextPt ? nextPt.name : 'Tu es à l’arrivée',
      nextKm: nextPt ? fmt(nextPt.km) : fmt(D),
      nextDetail: nextPt ? nextPt.detail : 'Bravo! Reviens au départ pour explorer encore.',
      goNextLabel: nextPt ? 'Y aller' : 'Au départ',
      goNext: () => set(nextPt ? nextPt.km : 0),
      prev: () => set(km - race.step),
      next: () => set(km + race.step)
    };
  }
}
</script>
