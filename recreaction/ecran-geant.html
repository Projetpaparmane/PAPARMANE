<script type="text/x-dc" id="dc-logic">
class Component extends DCLogic {
  renderVals() {
    const N = 21;
    let seed = 512;
    const rnd = () => {
      seed = (seed * 16807) % 2147483647;
      return seed / 2147483647;
    };
    const finder = (r, c) => {
      const zones = [[0, 0], [0, N - 7], [N - 7, 0]];
      for (let i = 0; i < zones.length; i++) {
        const rr = r - zones[i][0];
        const cc = c - zones[i][1];
        if (rr >= -1 && rr <= 7 && cc >= -1 && cc <= 7) {
          if (rr < 0 || rr > 6 || cc < 0 || cc > 6) return 0;
          if (rr === 0 || rr === 6 || cc === 0 || cc === 6) return 1;
          if (rr >= 2 && rr <= 4 && cc >= 2 && cc <= 4) return 1;
          return 0;
        }
      }
      return -1;
    };
    const qr = [];
    for (let r = 0; r < N; r++) {
      for (let c = 0; c < N; c++) {
        const f = finder(r, c);
        let on;
        if (f !== -1) on = f === 1;
        else if (r === 6 || c === 6) on = (r + c) % 2 === 0;
        else on = rnd() < 0.48;
        qr.push({ bg: on ? '#14201B' : '#FFFFFF' });
      }
    }
    return { qr };
  }
}
</script>
