<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page introuvable — Paparmane</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/svg+xml" href="/assets/imgs/favicon-dot.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#1a00a8;--text:#fff;--muted:#d2ccf7;--accent:#ff3535;--pad:clamp(1.25rem,5vw,5rem)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:"Inter",system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
    a{color:inherit;text-decoration:none}
    .top{padding:1.6rem var(--pad)}
    .logo{font-family:"Bagel Fat One",system-ui,sans-serif;font-size:1.9rem;line-height:1}
    .logo span{color:var(--accent)}
    main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:2rem var(--pad) 4rem}
    .code{display:flex;align-items:center;font-family:"Bagel Fat One",system-ui,sans-serif;font-size:clamp(7rem,26vw,20rem);line-height:.9;letter-spacing:-.02em}
    .zero{display:inline-block;width:.72em;height:.6em;margin:0 .04em;border-radius:50%;background:radial-gradient(ellipse at 40% 30%,#ff5a5a,#ff3535 55%,#e22a2a);box-shadow:0 .09em 0 #a51e1e,0 .16em .22em rgba(8,0,50,.45);animation:roule 6s ease-in-out infinite}
    @keyframes roule{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg) translateY(-.04em)}}
    h1{font-family:"Bagel Fat One",system-ui,sans-serif;font-weight:400;font-size:clamp(2rem,5vw,3.6rem);line-height:1.05;margin-top:1.5rem;max-width:18ch}
    p{margin-top:1.1rem;max-width:44ch;font-size:clamp(1.05rem,1.6vw,1.25rem);color:var(--muted)}
    p b{color:var(--text)}
    .actions{display:flex;flex-wrap:wrap;gap:1rem;margin-top:2.2rem}
    .btn{display:inline-block;font-weight:700;padding:.85rem 1.5rem;border-radius:100px;border:2px solid var(--text);transition:.25s}
    .btn--plein{background:var(--accent);border-color:var(--accent)}
    .btn:hover{transform:translateY(-2px)}
    .foot{padding:2rem var(--pad);font-size:.85rem;color:var(--muted)}
    @media (prefers-reduced-motion:reduce){.zero{animation:none}}
  </style>
</head>
<body>
  <header class="top"><a href="/" class="logo">Paparmane<span>.</span></a></header>
  <main>
    <div class="code" aria-label="404">4<span class="zero" aria-hidden="true"></span>4</div>
    <h1>Cette page n'existe pas.</h1>
    <p>Je n'ai pas eu le temps de la faire non plus. <b>J'étais occupée sur le site d'un client.</b></p>
    <div class="actions">
      <a class="btn btn--plein" href="/">Retour à l'accueil</a>
      <a class="btn" href="mailto:bonjour@paparmane.com">Me signaler le lien brisé</a>
    </div>
  </main>
  <footer class="foot">© 2026 Paparmane — Studio créatif</footer>
</body>
</html>
