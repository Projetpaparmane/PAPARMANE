# Static HTML site (Redox template) — no build step, publish the repo root.
[build]
  publish = "."

# Serveur local : site statique + fonctions (outil SEO) sans détection de framework.
[dev]
  framework = "#static"
  publish = "."

# Le CSS change souvent : toujours revalider (pas de cache figé).
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images, polices et librairies : quasi statiques -> cache long.
[[headers]]
  for = "/assets/imgs/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/webfonts/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Le code source de l'app Récréaction (dossier recreaction-app) est publié par son propre site Netlify,
# pas par le site de l'agence.
[[redirects]]
  from = "/recreaction-app/*"
  to = "/404.html"
  status = 404
  force = true
